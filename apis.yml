aid: omni
name: Omni
description: >-
  Omni is an AI-powered business intelligence and embedded analytics platform that
  turns a governed semantic model into a trusted source of truth for people and AI
  agents. It connects to warehouses like Snowflake, BigQuery, Databricks and Postgres,
  layers a git-versioned modeling layer (with dbt integration) on top, and exposes
  everything through a 187-operation REST API, a first-party CLI, an embed SDK, and a
  hosted MCP server for natural-language querying from Claude, ChatGPT, Cursor and
  more. Omni is backed by GV, ICONIQ Capital and Redpoint Ventures.
url: https://raw.githubusercontent.com/api-evangelist/omni/refs/heads/main/apis.yml
