                            description: Array of field names to include in the query
                          table:
                            type: string
                            description: Table name for the query
                        description: Query definition
                      description:
                        type: string
                        description: Query description
                      subTitle:
                        type: string
                        description: Subtitle for the query
                      prefersChart:
                        type: boolean
                        description: When `true`, show chart by default
                      topicName:
                        type: string
                        description: Topic name for the query
                      chartType:
                        oneOf:
                        - type: string
                        - type: 'null'
                        description: Chart type (line, bar, etc.)
                      visConfig:
                        type: object
                        description: Full visualization configuration
                      resultConfig:
                        type: object
                        description: Result display configuration
                      aiConfig:
                        type: object
                        description: AI configuration
                documentMetadata:
                  type: object
                  description: Document metadata for presentation settings
                  properties:
                    presentation:
                      type: object
                      properties:
                        filters:
                          type: object
                          properties:
                            collapsible:
                              type: boolean
                              description: Whether filters are collapsible
                            defaultExpanded:
                              type: boolean
                              description: Whether filters are expanded by default
                clearExistingDraft:
                  type: boolean
                  description: 'If `true`, discards any existing draft before updating.


                    **Note**: This parameter is required when a draft exists for the document.

                    '
            example:
              modelId: abc123
              name: Monthly Sales Dashboard
              description: Total monthly sales. Used in sales review meetings.
              facetFilters: true
              refreshInterval: null
              filterConfig:
                order_items.category:
                  type: string
                  kind: EQUALS
                  values:
                  - Electronics
                  is_negative: false
              filterOrder:
              - order_items.category
              queryPresentations:
              - name: Sales Trend
                description: Monthly sales over time
                prefersChart: true
                topicName: order_items
                query:
                  fields:
                  - order_items.created_at[month]
                  - order_items.sale_price_sum
                  table: order_items
                visConfig:
                  visType: basic
                  spec:
                    mark:
                      type: line
              documentMetadata:
                presentation:
                  filters:
                    collapsible: true
                    defaultExpanded: false
      responses:
        '200':
          description: Document updated successfully
          headers:
            Deprecation:
              description: Indicates that this endpoint is deprecated
              schema:
                type: string
                example: 'true'
            Sunset:
              description: The date this endpoint will be removed (RFC 9110)
              schema:
                type: string
                format: date
                example: '2026-07-31'
            Link:
              description: Link to the replacement API (RFC 8288)
              schema:
                type: string
                example: </api/documents-v2/create-document>; rel="successor-version"
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    description: The document identifier
                  name:
                    type: string
                    description: The updated document name
                  description:
                    type: string
                    description: The updated document description
              example:
                identifier: my-dashboard
                name: Q4 Sales Dashboard
                description: Total monthly sales. Used in sales review meetings.
        '400':
          description: 'Bad Request. Possible causes:


            - Missing required fields (`modelId`, `name`, `facetFilters`, `refreshInterval`, `filterConfig`, `filterOrder`, `queryPresentations`)

            - Invalid field values (`name` too long, `refreshInterval` less than `60`)

            - Empty `queryPresentations` array (at least one required)

            - Document has no dashboard (workbook-only document)

            - Analysis documents (workbooks or documents without a dashboard) are not supported

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User has insufficient permissions to update document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict. Draft already exists - set clearExistingDraft to true to discard it and proceed.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/documents/{documentId}/draft/{draftId}/dashboard:
    delete:
      description: 'Remove the dashboard from an existing draft, leaving a workbook-only document. Documents that are already workbook-only will remain unchanged.


        Use the [Publish draft endpoint](/api/documents-v2/publish-draft) to apply the changes from this endpoint to the published version of the document. **Note**: Schedules will be removed when the document is published.'
      operationId: documentsV2RemoveDashboard
      summary: Remove dashboard from document
      tags:
      - Documents
      parameters:
      - schema:
          type: string
          example: def456
        required: true
        description: ID of the existing draft, created from a successful call to the [Create draft and patch document endpoint](/api/documents-v2/create-draft-and-patch-document).
        name: draftId
        in: path
      - schema:
          type: string
          example: abc123
        required: true
        description: ID of the published document associated with the draft.
        name: documentId
        in: path
      responses:
        '200':
          description: Dashboard removed on the draft. The response includes the `draftIdentifier`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsV2PatchDraftResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError401'
        '403':
          description: Insufficient permissions to update the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError403'
        '404':
          description: Document or draft not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError404'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The specified document is not a published document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError409'
        '422':
          description: The document is an app, not a dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    DocumentOwner:
      type: object
      description: Document owner
      properties:
        id:
          type: string
          description: Owner membership ID
        name:
          type: string
          description: Owner display name
      required:
      - id
      - name
    DocumentFolder:
      type:
      - object
      - 'null'
      description: Folder containing the document
      properties:
        id:
          type: string
          description: Folder ID
        name:
          type: string
          description: Folder name
        path:
          type: string
          description: Folder path
        scope:
          type: string
          enum:
          - restricted
          - organization
          description: Folder access scope
      required:
      - id
      - name
      - path
      - scope
    PageInfo:
      type: object
      description: Pagination information for paginated responses.
      properties:
        hasNextPage:
          type: boolean
          description: Indicates if there are more records available.
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page of results. `null` if no more results.
        pageSize:
          type: integer
          description: Number of records per page.
        totalRecords:
          type: integer
          description: Total number of records matching the query.
    Document:
      type: object
      properties:
        _count:
          type: object
          properties:
            favorites:
              type: number
              description: Number of users who favorited this document
            views:
              type: number
              description: Number of views
          required:
          - favorites
          - views
          description: Document counts (included when `_count` is in `include` param)
        connectionId:
          type: string
          description: Connection ID the document is associated with
        deleted:
          type: boolean
          description: Whether the document is deleted (archived)
        folder:
          $ref: '#/components/schemas/DocumentFolder'
        hasDashboard:
          type: boolean
          description: Whether the document has an associated dashboard
        identifier:
          type: string
          description: Document identifier
          example: abc123
        labels:
          type: array
          items:
            type: string
          description: Labels applied to the document (included when `labels` is in `include` param)
        name:
          type: string
          description: Document name
        description:
          type: string
          description: Description of the document
        owner:
          $ref: '#/components/schemas/DocumentOwner'
        scope:
          type: string
          enum:
          - restricted
          - organization
          description: Document access scope
        type:
          type: string
          enum:
          - document
          description: Content type
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Last updated timestamp
        url:
          type: string
          description: URL to view the document. Returns dashboard URL if document has a dashboard, otherwise workbook URL.
          example: https://org.omni.co/dashboards/abc123
      required:
      - connectionId
      - deleted
      - folder
      - hasDashboard
      - identifier
      - name
      - owner
      - scope
      - type
      - updatedAt
      - url
    Error:
      type: object
      properties:
        error:
          type: string
          description: HTTP response code for the error
          example: <response_code>
        message:
          type: string
          description: Detailed error description
          example: <error_reason>
    ApiError401:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message describing what went wrong.
          example: 'Unauthorized: Missing or invalid API key'
        status:
          type: integer
          description: HTTP status code of the error.
          example: 401
      required:
      - detail
      - status
    DocumentsV2PatchDraftResponse:
      type: object
      required:
      - description
      - draftIdentifier
      - identifier
      - name
      properties:
        identifier:
          type: string
          description: Published document identifier the draft targets.
          example: def456
        draftIdentifier:
          type: string
          description: Identifier of the draft the patch was applied to.
          example: abc123
        name:
          type: string
          description: Document name.
          example: Blob Sales
        description:
          type:
          - string
          - 'null'
          description: Document description.
          example: Overview of daily Blobs R Us Sales
    ApiError403:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message describing what went wrong.
        status:
          type: integer
          description: HTTP status code of the error.
          example: 403
      required:
      - detail
      - status
    DocumentsListResponse:
      type: object
      properties:
        pageInfo:
          allOf:
          - $ref: '#/components/schemas/PageInfo'
          - description: Pagination information
        records:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          description: List of documents
      required:
      - pageInfo
      - records
    ApiError400:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message describing what went wrong.
        status:
          type: integer
          description: HTTP status code of the error.
          example: 400
      required:
      - detail
      - status
    DocumentsUpgradeLayoutBody:
      type: object
      properties:
        clearExistingDraft:
          type: boolean
          default: false
          description: When upgrading a published document, discard any existing draft instead of failing with a conflict.
    DocumentsUpgradeLayoutResponse:
      type: object
      properties:
        identifier:
          type: string
          description: Document identifier
        upgraded:
          type: boolean
          description: True when the layout was upgraded, false when the document already had advanced layout (no-op).
      required:
      - identifier
      - upgraded
    ApiError404:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message describing what went wrong.
        status:
          type: integer
          description: HTTP status code of the error.
          example: 404
      required:
      - detail
      - status
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    ApiError409:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message describing what went wrong.
        status:
          type: integer
          description: HTTP status code of the error.
          example: 409
      required:
      - detail
      - status
  responses:
    MethodNotAllowed:
      description: Method Not Allowed - Invalid HTTP method for this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too Many Requests - Rate limit exceeded (60 requests/minute)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Can be either an [Organization API Key](/api/authentication#organization-api-keys) or [Personal Access Token (PAT)](/api/authentication#token-types).


        Include in the `Authorization` header as: `Bearer YOUR_TOKEN`

        '
    orgApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Requires an [Organization API Key](/api/authentication#organization-api-keys). Personal Access Tokens (PATs) are not supported for this endpoint.


        Include in the `Authorization` header as: `Bearer ORGANIZATION_API_KEY`

        '
