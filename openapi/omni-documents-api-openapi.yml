    patch:
      tags:
      - Documents
      summary: Update document
      deprecated: true
      description: "<Warning>\n  **Deprecated** — Removal scheduled for **July 31, 2026**. Use the [Documents v2 API](/api/documents-v2/create-document) instead.\n</Warning>\n\nUpdates the name, description, and/or identifier of a document. **Note**: At least one of `name`, `description`, or `identifier` must be provided or the API will return a `Bad Request` error.\n\nRenaming a document follows the app's draft/publish workflow:\n\n| Document Type | Behavior |\n|---------------|----------|\n| **Draft** | Renamed directly |\n| **Published (no existing draft)** | Creates draft > Renames draft > Publishes draft |\n| **Published (existing draft, `clearExistingDraft: true`)** | Discards existing draft > Creates new draft > Renames > Publishes |\n| **Published (existing draft, `clearExistingDraft` not set)** | Returns `409 Conflict` |\n"
      security:
      - bearerAuth: []
      operationId: renameDocument
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: Document identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: New name for the document.
                description:
                  type: string
                  maxLength: 1024
                  description: Updated description of the document. Set as `null` to clear the description.
                clearExistingDraft:
                  type: boolean
                  description: 'If `true`, discards any existing draft before renaming.


                    **Note**: This parameter is required when a draft exists for the document.

                    '
                identifier:
                  type: string
                  description: 'New identifier for the document. Renaming the identifier works with published documents and maintains old URLs via automatic redirects.


                    When you change a document''s identifier:

                    - Both the workbook and document identifiers are updated in one transaction

                    - A `DocumentIdentifierHistory` entry is created so requests to the old identifier automatically redirect to the new one

                    - Dashboard and document history entries are updated


                    **Format requirements:**

                    - Must match the pattern: lowercase letters, numbers, hyphens, and underscores only

                    - Cannot start or end with a hyphen or underscore

                    - Must be unique across all documents in your organization


                    **Common use case:** Migrating content between environments (e.g., staging → production) while maintaining specific identifiers.

                    '
                  example: sales-dashboard-archived
            examples:
              renameIdentifier:
                summary: Rename document identifier only
                value:
                  identifier: sales-dashboard-archived
              updateNameAndIdentifier:
                summary: Update both name and identifier
                value:
                  name: Q2 2026 Sales Report
                  identifier: q2-sales-report
              renameName:
                summary: Rename document name only
                value:
                  name: Updated Dashboard Name
      responses:
        '200':
          description: Document renamed successfully
          headers:
            Deprecation:
              description: Indicates that this endpoint is deprecated
              schema:
                type: string
                example: 'true'
            Sunset:
              description: The date this endpoint will be removed (RFC 9110)
              schema:
                type: string
                format: date
                example: '2026-07-31'
            Link:
              description: Link to the replacement API (RFC 8288)
              schema:
                type: string
                example: </api/documents-v2/create-draft-and-patch-document>; rel="successor-version"
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    description: The document identifier
                  name:
                    type: string
                    description: The new document name
              examples:
                renameIdentifier:
                  summary: Rename document identifier
                  value:
                    identifier: sales-dashboard-archived
                    name: Sales Dashboard
                updateNameAndIdentifier:
                  summary: Update both name and identifier
                  value:
                    identifier: q2-sales-report
                    name: Q2 2026 Sales Report
        '400':
          description: 'Bad Request. Possible causes:


            - Request body must have `name`, `description`, or `identifier`

            - Name exceeds 255 characters

            - Description exceeds 1024 characters

            - Identifier format is invalid (must be lowercase letters, numbers, hyphens, and underscores; cannot start/end with hyphen or underscore)

            - Identifier is already in use by another document

            - Draft already exists - set clearExistingDraft to true to discard it and proceed

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User has insufficient permissions to update document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: 'Conflict. Published document has an existing draft and `clearExistingDraft` is not set to `true`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
