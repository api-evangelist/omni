  /v1/documents/{identifier}/favorites:
    get:
      tags:
        - Document favorites
      summary: List document favoriters
      description: >
        <Note>
          This endpoint requires **Manager** or **Owner** permissions on the requested document.
        </Note>


        Lists users who have favorited a published document, paginated and
        sorted by `favoritedAt`.


        Use this endpoint when you need to know "who favorited document X" — for
        example, a content-migration script that preserves favorites when
        replacing a document needs to call this once per document, rather than
        iterating every user in the organization.
      security:
        - orgApiKey: []
      operationId: listDocumentFavoriters
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
          description: Document identifier (either document ID or slug).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: >-
            Page cursor from a previous response's `nextCursor`. Omit for the
            first page.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page (min 1, max 100).
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: >-
            Sort direction by `favoritedAt`. `asc` returns oldest favorites
            first; `desc` returns newest first.
      responses:
        '200':
          description: Successfully retrieved list of users who favorited the document
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                          description: Membership ID of the favoriting user.
                        name:
                          type: string
                          description: User's display name.
                        email:
                          type: string
                          description: User's email address.
                        favoritedAt:
                          type: string
                          format: date-time
                          description: >-
                            ISO 8601 timestamp recording when the user favorited
                            the document.
                      required:
                        - userId
                        - name
                        - email
                        - favoritedAt
                required:
                  - pageInfo
                  - records
              examples:
                basicResponse:
                  summary: Basic request with 2 favoriters
                  value:
                    pageInfo:
                      hasNextPage: false
                      nextCursor: null
                      pageSize: 20
                      totalRecords: 2
                    records:
                      - userId: f1c2a3e4-1111-1111-1111-111111111111
                        name: Blob Ross
                        email: blob.ross@eblobsrus.com
                        favoritedAt: '2026-04-12T10:14:02.000Z'
                      - userId: f1c2a3e4-2222-2222-2222-222222222222
                        name: Blob the Builder
                        email: blob.the.builder@blobsrus.com
                        favoritedAt: '2026-05-01T17:33:21.000Z'
                emptyResponse:
                  summary: Document with no favoriters
                  value:
                    pageInfo:
                      hasNextPage: false
                      nextCursor: null
                      pageSize: 20
                      totalRecords: 0
                    records: []
        '400':
          description: |
            Bad Request. Invalid query parameters.

            Possible causes:
            - Unparseable cursor
            - Out-of-range `pageSize` (must be 1-100)
            - Invalid `sortDirection` (must be `asc` or `desc`)
            - Unknown query parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  status:
                    type: integer
              examples:
                invalidCursor:
                  summary: Invalid cursor
                  value:
                    detail: 'Invalid cursor: not-a-number'
                    status: 400
                invalidPageSize:
                  summary: Page size out of range
                  value:
                    detail: pageSize must be between 1 and 100
                    status: 400
                unknownParam:
                  summary: Unknown query parameter
                  value:
                    detail: 'Unrecognized key: random_bogus_param'
                    status: 400
        '401':
          description: Missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Forbidden. Possible causes:
            - Caller lacks `MANAGER` permission on the document
            - Used a user-scoped (personal access token) API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  status:
                    type: integer
              examples:
                insufficientPermission:
                  summary: Insufficient permission on document
                  value:
                    detail: You do not have permission to manage document access.
                    status: 403
                userScopedKey:
                  summary: User-scoped API key not allowed
                  value:
                    detail: >-
                      User-scoped API keys are not allowed to list document
                      favoriters
                    status: 403
        '404':
          description: Document not found (or unpublished)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  status:
                    type: integer
              examples:
                notFound:
                  summary: Document not found
                  value:
                    detail: Document with identifier "does-not-exist" not found
                    status: 404
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{documentId}/labels:
    patch:
      tags:
        - Document labels
      summary: Bulk update document labels
      x-mint:
        content: >
          Add and/or remove multiple labels from a document in a single atomic
          operation.


          When using this endpoint, keep in mind that:


          - **All changes succeed or fail together.** No partial updates occur.

          - **Label matching is case-insensitive**.

          - **Requests must have at least one operation.** Either `add` or
          `remove` must contain at least one label.

          - **Labels must already exist to be added to or removed from a
          document.** Create labels via the [Create label
          API](/api/labels/create-label).

          - **Labels cannot be included in both `add` and `remove` in the same
          request.**

          - **Organization Admin permissions are required to**:
             - Add or remove **Verified** labels
             - Add or remove **Homepage** labels
      security:
        - bearerAuth: []
      operationId: bulkUpdateDocumentLabels
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The document identifier (UUID)
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: >
            **Requires an Organization API key**. Optional user ID that
            attributes the action to the specified user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  type: array
                  items:
                    type: string
                    minLength: 2
                    maxLength: 25
                  default: []
                  description: Label names to add to the document
                remove:
                  type: array
                  items:
                    type: string
                    minLength: 2
                    maxLength: 25
                  default: []
                  description: Label names to remove from the document
            examples:
              addLabels:
                summary: Add labels
                value:
                  add:
                    - production
                    - reviewed
              removeLabels:
                summary: Remove labels
                value:
                  remove:
                    - draft
                    - needs-review
              addAndRemove:
                summary: Add and remove labels
                value:
                  add:
                    - approved
                  remove:
                    - pending-review
      responses:
        '200':
          description: Labels updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      type: string
                    description: The updated list of labels on the document
              example:
                labels:
                  - label-one
                  - label-two
                  - new-label
        '400':
          description: |
            Bad Request. Possible causes:

            - Empty request - Neither `add` nor `remove` contains any labels
            - Label appears in both `add` and `remove` arrays
            - Invalid label name (less than 2 or more than 25 characters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emptyRequest:
                  summary: Empty request
                  value:
                    detail: >-
                      Bad Request: At least one label must be specified in add
                      or remove
                    status: 400
                    title: Bad Request
                conflictingLabels:
                  summary: Label in both arrays
                  value:
                    detail: >-
                      Bad Request: Labels cannot appear in both add and remove
                      arrays
                    status: 400
                    title: Bad Request
        '403':
          description: >
            Forbidden. Possible causes:


            - User does not have `canLabel` permission on the document

            - User lacks Organization Admin permissions to modify Verified
            labels

            - User lacks Organization Admin permissions to modify Homepage
            labels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                permissionDenied:
                  summary: Permission denied
                  value:
                    detail: >-
                      You do not have permission to modify labels on this
                      document.
                    status: 403
                    title: Forbidden
                verifiedLabelDenied:
                  summary: Verified label permission denied
                  value:
                    detail: >-
                      You do not have permission to modify Verified labels on
                      this document
                    status: 403
                    title: Forbidden
        '404':
          description: >
            Not Found. Possible causes:


            - Document does not exist

            - Label does not exist globally. Create the label first with the
            [Create label API](/api/labels/create-label).

            - Label in `remove` array does not exist on the document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                documentNotFound:
                  summary: Document not found
                  value:
                    detail: Document with identifier "abc123" not found
                    status: 404
                    title: Not Found
                labelNotFound:
                  summary: Label not found globally
                  value:
                    detail: Label "my-label" not found
                    status: 404
                    title: Not Found
                labelNotOnDocument:
                  summary: Label not on document
                  value:
                    detail: >
                      Labels not found on this document: "label-one",
                      "label-two"
                    status: 404
                    title: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{documentId}/labels/{labelName}:
    put:
      tags:
        - Document labels
      summary: Apply label to document
      description: >
        Apply an existing label to a document. Labels must be created first via
        the [Create label](/api/labels/create-label) endpoint.


        Documents can have multiple labels. When a new label is applied using
        this endpoint, the API adds it to the document's existing labels. Labels
        are not replaced.
      security:
        - bearerAuth: []
      operationId: applyLabelToDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: The document identifier
        - name: labelName
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 25
          description: >
            The label name to apply:


            - Must be 2-25 characters

            - Labels are **case insensitive**. For example, adding `BlobSales`
            when `blobsales` exists will be treated as a duplicate. 

            - Special characters must be URL-encoded (e.g., `Q1%202024` for "Q1
            2024").


            Additionally, adding **Verified** or **Homepage** labels require
            Organization Admin permissions.
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: >
            **Requires an Organization API key**. Optional user ID that
            attributes the action to the specified user.
      responses:
        '204':
          description: >
            Label applied successfully. No response body.


            This response is returned whether the label was newly applied or
            already existed on the document.
        '400':
          description: |
            Bad Request. Possible causes:

            - Label name too short (less than 2 characters)
            - Label name too long (more than 25 characters)
            - Invalid HTTP method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Forbidden. Possible causes:

            - User does not have Manager role on the specified document
            - User lacks Organization Admin permissions for Verified labels
            - User lacks Organization Admin permissions for Homepage labels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Not Found. Possible causes:


            - Document does not exist

            - Label does not exist. Must be created first via the [Create
            label](/api/labels/create-label).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Document labels
      summary: Remove label from document
      x-mint:
        content: |
          Remove a label from a document.

          <Note>
            This endpoint is not idempotent. If the label does not exist on the document, the API returns a `404` error.
          </Note>
      security:
        - bearerAuth: []
      operationId: removeLabelFromDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: The document identifier
        - name: labelName
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 25
          description: >
            The label name to remove:


            - Must be 2-25 characters

            - Labels are **case insensitive**. For example, removing `BlobSales`
            will remove `blobsales` if it exists on the document.

            - Special characters must be URL-encoded (e.g., `Q1%202024` for "Q1
            2024").
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: >
            **Requires an Organization API key**. Optional user ID that
            attributes the action to the specified user.
      responses:
        '204':
          description: Label removed successfully. No response body.
        '403':
          description: >
            Forbidden. User does not have permission to modify labels on this
            document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found. Possible causes:

            - Document does not exist
            - Label does not exist on this document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Label "production" not found on this document
                status: 404
                title: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{documentId}/permissions:
    post:
      tags:
        - Document permissions
      summary: Grant document permissions
      description: Grant document permissions to users or groups
      security:
        - bearerAuth: []
      operationId: grantDocumentPermissions
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >
            The document identifier. To retrieve the ID, navigate to **File >
            Document settings** in the document and then click **Settings**. The
            **Identifier** field contains the document ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - NO_ACCESS
                    - VIEWER
                    - EDITOR
                    - MANAGER
                  description: >
                    The content role to assign. Must be one of:

                    - `NO_ACCESS` - No access. Document won't appear in content
                    system or search results.

                    - `VIEWER` - View dashboard

                    - `EDITOR` - Edit dashboard and workbook

                    - `MANAGER` - Edit dashboard and workbook and manage
                    permissions
                accessBoost:
                  type: boolean
                  default: false
                  description: If `true`, AccessBoost will be enabled for the document.
                userIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: >
                    The list of user IDs to assign permissions to. Use the [List
                    users](/api/users/list-users) and [List embed
                    users](/api/users/list-embed-users) endpoints to retrieve
                    user IDs. **Either `userIds` or `userGroupIds` is
                    required.**
                userGroupIds:
                  type: array
                  items:
                    type: string
                  description: >
                    The list of user group IDs to assign permissions to. Use the
                    [List user groups](/api/user-groups/list-user-groups)
                    endpoint to retrieve user group IDs. **Either `userIds` or
                    `userGroupIds` is required.**
      responses:
        '200':
          description: Permissions granted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: |
            Bad Request. Possible causes:

            - Missing `userIds` or `userGroupIds` parameter
            - Invalid `userId` value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingIds:
                  summary: Missing userIds or userGroupIds
                  value:
                    detail: >-
                      userIds.userGroupIds: userIds or userGroupIds must be
                      provided
                    status: 400
                invalidUuid:
                  summary: Invalid userId value
                  value:
                    detail: 'userIds.0: Invalid uuid'
                    status: 400
        '403':
          description: >
            Forbidden. The user sending the API request must have **Manager**
            permissions for the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: User does not have permission to manage document permissions
                status: 403
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Document with identifier "<documentId>" not found
                status: 404
        '429':
          $ref: '#/components/responses/TooManyRequests'
