    delete:
      description: >-
        Archive (soft-delete) an eval run. Any non-terminal per-prompt agentic
        jobs are cancelled as part of the archive (best-effort), and a
        still-RUNNING run is flipped to CANCELLED before archival. The call is
        idempotent; archiving an already-terminal or already-archived run is a
        no-op.
      operationId: aiEvalRunsArchive
      summary: Archive an eval run
      tags:
        - AI Eval
      parameters:
        - schema:
            type: string
            format: uuid
