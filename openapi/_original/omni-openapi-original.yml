        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/refresh:
    post:
      tags:
        - Models
      summary: Refresh schema
      description: >
        <Note>
          This endpoint requires either **Connection Admin** or **Modeler** permissions:

          - **Modelers** can use this endpoint on connections that have exactly **one** shared model
          - **Connection Admins** can use this endpoint on any connection they are an admin of, whether the connection has one or multiple models
        </Note>


        Refreshes the schema of the specified model. This will cause the model
        to reflect the latest changes to schemas, views, and fields from the
        data source. Schema refreshes will remove structures that are no longer
        present in the source, but not anything created by users.


        Depending on whether the **Branch-based schema refresh** setting is
        configured:


        - If **Branch-based schema refresh** is enabled, the `branch_id` query
        parameter is required. The `branch_id` is validated against the shared
        model.

        - If **Branch-based schema refresh** isn't enabled, do not provide the
        `branch_id` parameter. The API will return a `400` error in this case.
      security:
        - bearerAuth: []
      operationId: refreshSchema
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the model to be refreshed.
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: >
            **Required if Branch-based schema refresh is enabled**. The ID of
            the branch for models with this setting enabled.


            Do not provide this parameter when the setting is not enabled.
        - name: hard_refresh
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: >
            Whether to perform a hard refresh (removes dropped objects) or soft
            refresh (additive only). Defaults to true (hard refresh).
        - name: schemas
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated list of schemas to selectively refresh. Can only be
            used when `hard_refresh=false`.
        - name: tables
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated list of tables to selectively refresh. Can only be
            used when `hard_refresh=false`.
      responses:
        '200':
          description: Model refresh started
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                    description: ID of the job.
                  modelId:
                    type: string
                    format: uuid
                    description: ID of the model.
                  status:
                    type: string
                    example: running
                    description: >-
                      Status of the schema refresh. This value will be `running`
                      to indicate that the refresh has started.
        '400':
          description: >
            Bad Request


            Possible error messages:


            - `Bad Request: modelId: Invalid uuid`

            - `Bad Request: branch_id: Invalid uuid`

            - `Bad Request: branch_id is required when branch schema refresh is
            enabled`

            - `Bad Request: branch_id must not be provided when branch schema
            refresh is not enabled`

            - `Bad Request: selective schemas/tables filters require
            hard_refresh=false`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Not Found

            Possible causes:

            - Model not found
            - Branch not found or does not belong to the model's shared model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/cache_reset/{cachePolicyName}:
    post:
      tags:
        - Models
      summary: Reset cache
      description: |
        Resets the cache for the specified cache policy.

        <Note>
          `cachePolicyName` values are not validated against existing policies. Verify that the values you provide are exact matches to policies in the model.
        </Note>
      security:
        - bearerAuth: []
      operationId: resetModelCache
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the model associated with the cache policy.
        - name: cachePolicyName
          in: path
          required: true
          schema:
            type: string
          description: The name of the cache policy to reset.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resetAt:
                  type: string
                  format: date-time
                  description: >
                    An ISO-8601 date string that sets the time the cache should
                    be reset (invalidated). When set, cache entries created
                    between this value and the current time will still be
                    considered valid. Cannot be a future date. Defaults to now.
      responses:
        '200':
          description: Cache reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  cache_reset:
                    type: object
                    description: The cache reset details.
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: ID of the cache reset record.
                      model_id:
                        type: string
                        format: uuid
                        description: ID of the model.
                      policy_name:
                        type: string
                        description: Name of the cache policy.
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp when the cache reset record was created.
                      updated_at:
                        type: string
                        format: date-time
                        description: >-
                          Timestamp when the cache reset record was last
                          updated.
                      reset_at:
                        type: string
                        format: date-time
                        description: Timestamp when the cache was reset.
                  success:
                    type: boolean
                    description: Indicates the request was successful.
        '400':
          description: |
            Bad Request

            Possible error messages:

            - `Model with id <modelId> does not exist`
            - `resetAt cannot be future dated`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Model with id <modelId> does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/yaml:
    post:
      tags:
        - Models
      summary: Create or update YAML files
      description: >
        Creates or overwrites a YAML file for a model. The file can be a special
        file (`model` or `relationships`) or a YAML file ending in `.topic` or
        `.view`.


        The following models cannot be edited using this endpoint:


        - Schema models

        - Models using git follower mode
      security:
        - bearerAuth: []
      operationId: updateModelYaml
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileName
                - yaml
                - mode
              properties:
                branchId:
                  type: string
                  format: uuid
                  description: >
                    **Required if git pull requests are required for the
                    model.** The ID of the branch to create or update. To
                    retrieve branch IDs, use the [List
                    models](/api/models/list-models) endpoint with
                    `modelKind=BRANCH`.
                fileName:
                  type: string
                  description: >
                    The name of the YAML file. Valid values are:


                    - `model` - [Model file](/modeling/models)

                    - `relationships` - [Relationships
                    file](/modeling/relationships)

                    - `<topic_name>.topic` - [Topic
                    file](/modeling/topics/parameters)

                    - `<view_name>.view` - [View file](/modeling/views)
                yaml:
                  type: string
                  description: >
                    The YAML contents of the file. This can be empty, in which
                    case:


                    - If empty and used with `mode: extension` the file will be
                    removed from the model

                    - If empty and used with `mode: combined`, the file will be
                    ignored in the model
                mode:
                  type: string
                  default: combined
                  enum:
                    - combined
                    - extension
                    - staged
                    - merged
                    - history
                  description: >
                    The mode to use when creating or overwriting the YAML file.


                    **Note**: Workbook models must use `combined` mode if there
                    is a `branchId`.
                commitMessage:
                  type: string
                  description: >
                    **Required for [git-enabled models](/integrations/git).**
                    Commit message describing the change.
                previousChecksum:
                  type: string
                  description: >
                    Checksum of the file when fetched, for conflict detection.
                    Obtain this value from the [Get model YAML
                    endpoint](/api/models/get-model-yaml) by including the
                    `includeChecksums` parameter.


                    If the file has been modified since you fetched it, the
                    request will fail with a `File has been modified since it
                    was fetched` error.
                fullyResolved:
                  type: boolean
                  default: false
                  description: >
                    If `true`, accepts fully-resolved YAML. This means that Omni
                    will resolve any extension (`extends`) usage and place the
                    changes into the appropriate model files.


                    When `false` (default), the YAML is saved as-is to the
                    specified file. This means that even if extensions are used,
                    they will not be included in the changes.
      responses:
        '200':
          description: YAML file updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileName:
                    type: string
                    description: The name of the file that was created or updated.
                  success:
                    type: boolean
                    description: Indicates the request was successful.
        '400':
          description: |
            Bad Request

            Possible error messages:

            - `<parameter>: <parameter> is required`
            - `modelId: Invalid uuid`
            - `branchId: Invalid uuid`
            - `<parameter>: Invalid value <description>`
            - `File has been modified since it was fetched`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Forbidden

            Possible error messages:

            - `Permission denied`
            - `Feature not enabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Model with id <modelId> does not exist`
            - `Branch does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - Models
      summary: Get model YAML
      description: >-
        Retrieves the YAML representation of a model with optional filtering and
        mode selection.
      security:
        - bearerAuth: []
      operationId: getModelYaml
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the model.
        - name: branchId
          in: query
          schema:
            type: string
            format: uuid
          description: >-
            The ID of the branch to retrieve YAML from. Only valid for shared
            models in `combined` mode. To retrieve branch IDs, use the [List
            models](/api/models/list-models) endpoint with `modelKind=BRANCH`.
        - name: fileName
          in: query
          schema:
            type: string
          description: Filter YAML files by name. Can be a string or a regex pattern.
        - name: mode
          in: query
          schema:
            type: string
            default: combined
            enum:
              - extension
              - staged
              - combined
          description: |
            The mode to use when retrieving YAML.

            - `extension` - Returns extension-only format
            - `staged` - Returns staged changes
            - `combined` - Returns combined YAML
        - name: includeChecksums
          in: query
          schema:
            type: boolean
            default: false
          description: >
            If `true`, the response will include file checksums for concurrency
            control.


            A file's checksum can be passed as a query parameter in the [Create
            or update YAML endpoint](/api/models/create-or-update-yaml-files) to
            ensure changes made by another user aren't overwritten.
        - name: includeSchemas
          in: query
          schema:
            type: string
          description: >
            Filters the returned YAML to only include views from the specified
            schema. Relationships are preserved even if they reference views
            outside the specified schema.


            This parameter accepts a single schema name only. Use the [List
            model schemas endpoint](/api/models/list-model-schemas) to discover
            available schema names.
        - name: fullyResolved
          in: query
          schema:
            type: boolean
            default: false
          description: >
            If `true`, returns YAML with any extensions (`extends`) resolved.
            This will match what runs at query time.


            When `false` (default), returns the YAML as authored in the model
            files. This means even if extensions are used, they will not be
            included in the returned YAML.
      responses:
        '200':
          description: Model YAML specification
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: object
                    additionalProperties:
                      type: string
                    description: Map of file paths to YAML content.
                  version:
                    type: integer
                    description: Version of the YAML.
                  viewNames:
                    type: object
                    description: Map of view names to their definitions.
                  checksums:
                    type: object
                    description: Map of file paths to their checksums.
              example:
                files:
                  model.yaml: |-
                    name: Test Model
                    type: model
                  views/customers.yaml: |-
                    name: Customers
                    fields: []
                  views/orders.yaml: |-
                    name: Orders
                    fields: []
                version: 1
                viewNames: {}
        '400':
          description: >
            Bad Request


            Possible error messages:


            - `Schema models do not have branches`

            - `Branches are not valid for workbook models with mode=extension,
            staged`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Forbidden

            Possible error messages:

            - `Permission denied`
            - `Feature not enabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Model with id <modelId> does not exist`
            - `Branch does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            Internal Server Error

            Possible error messages:

            - `Failed to get model YAML`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Models
      summary: Delete a YAML file
      description: >
        Deletes a topic or view YAML file from a model. The file must be a YAML
        file ending in `.topic` or `.view`.


        The following models cannot be edited using this endpoint:


        - Schema models

        - Models using git follower mode
      security:
        - bearerAuth: []
      operationId: deleteModelYaml
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the model.
        - name: fileName
