          format: uuid
          description: Unique identifier for the suggestion.
        category:
          type: string
          description: Suggestion category, e.g. `missing_context`.
          example: missing_context
        title:
          type: string
          description: Short human-readable title.
        rationale:
          type: string
          description: Explanation of why the suggestion was made.
        priority:
          type: integer
          minimum: 1
          maximum: 10
          description: Priority from 1 (highest) to 10 (lowest).
          example: 1
        proposedChanges:
          $ref: '#/components/schemas/SuggestionProposedChanges'
        evidence:
          type: array
          nullable: true
          description: >-
            Source evidence for the suggestion. `null` for rows created before
            evidence was tracked; `[]` when none was cited.
          items:
            $ref: '#/components/schemas/SuggestionEvidenceItem'
        ignoreReason:
          type: string
          nullable: true
          description: >-
            Optional free-text reason recorded when the suggestion was
            dismissed.
        ignoredAt:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp of dismissal, or `null` if active.
        ignoredBy:
          type: string
          format: uuid
          nullable: true
          description: User ID that dismissed the suggestion, or `null` if active.
        aiModifiedAt:
          type: string
          format: date-time
          description: >-
            ISO 8601 timestamp of the last AI write (create or AI update).
            Unaffected by dismiss/restore.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the suggestion was created.
        updatedAt:
          type: string
          format: date-time
          description: >-
            ISO 8601 timestamp of the last write of any kind, including
            dismiss/restore.
    SuggestionEvidenceItem:
      type: object
      required:
        - type
        - chatAiSessionId
        - capturedAt
      properties:
        type:
          type: string
          enum:
            - ai_chat
          description: The kind of evidence. Currently always `ai_chat`.
        chatAiSessionId:
          type: string
          format: uuid
          description: Chat session that motivated the suggestion.
        capturedAt:
          type: string
          description: ISO 8601 timestamp of when the evidence was captured.
    SuggestionProposedChanges:
      type: object
      description: The change(s) the suggestion would apply to the model.
      required:
        - kind
        - edits
      properties:
        kind:
          type: string
          enum:
            - context_edits
          description: The kind of change. Currently always `context_edits`.
        edits:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionContextEdit'
    SuggestionRun:
      type: object
      description: Represents a single AI model suggestion generation run.
      required:
        - id
        - status
        - triggerSource
        - triggeredBy
        - createdAt
        - executionStartedAt
        - completedAt
        - error
      properties:
        id:
          type: string
          format: uuid
          description: The run ID.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        status:
          type: string
          enum:
            - queued
            - executing
            - complete
            - failed
          description: Run status. Terminal states are `complete` and `failed`.
          example: complete
        triggerSource:
          type: string
          enum:
            - manual
            - scheduled
          description: Whether the run was triggered manually or by the schedule.
          example: manual
        triggeredBy:
          type: object
          nullable: true
          description: The user who triggered a manual run; `null` for scheduled runs.
          properties:
            userId:
              type: string
              format: uuid
              description: The user's ID.
              example: b2c3d4e5-f6a7-8901-bcde-f12345678901
            name:
              type: string
              nullable: true
              description: The user's name.
              example: Jane Doe
          required:
            - userId
            - name
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the run was created (queued).
          example: '2026-07-15T14:30:00Z'
        executionStartedAt:
          type: string
          nullable: true
          format: date-time
          description: >-
            ISO 8601 timestamp when the worker started executing; `null` while
            queued.
          example: '2026-07-15T14:30:05Z'
        completedAt:
          type: string
          nullable: true
          format: date-time
          description: ISO 8601 timestamp when the run reached a terminal state.
          example: '2026-07-15T14:32:30Z'
        error:
          type: object
          nullable: true
          additionalProperties: {}
          description: Failure details when `status` is `failed`; `null` otherwise.
    WhoamiModelRole:
      type: object
      required:
        - baseRole
        - connectionId
        - permissions
        - roleName
      properties:
        baseRole:
          type: string
          description: The resolved base role. For custom roles, the base role they extend.
          example: QUERIER
        connectionId:
          type: string
          description: The connection this model belongs to
        permissions:
          type: array
          items:
            type: string
            enum:
              - QUERY_FULL_MODEL
              - QUERY_SQL
              - VIEW_SQL
              - QUERY_TOPICS
              - RUN_CONTENT_QUERIES
              - DOWNLOAD_CONTENT_QUERY
              - UPLOAD_CSV
              - SCHEDULE
              - SAVE_SPREADSHEETS
              - USE_AI
              - USE_WORKBOOKS
              - UPDATE
              - UPDATE_RESTRICTED
          description: >
            The caller''s resolved/effective permissions on this model,
            reflecting custom roles. This is a capability signal for the
            directly-roleable model kinds (schema / shared / extension). 


            It does not enumerate the permissions you derive on branch,
            workbook, and query models from your role on the base model they
            descend from - bsence here does not mean you lack access on those
            derived models.`MANAGE_MODEL`, `READ`, and `REFRESH_SCHEMA` are also
            not reported: they derive from connection / sibling-model roles
            rather than a per-model rule.
          example:
            - QUERY_TOPICS
            - QUERY_SQL
            - USE_WORKBOOKS
        roleName:
          type: string
          description: >-
            The resolved role name; may be a custom role. Use `permissions` to
            decide capability.
          example: QUERIER
    WhoamiUser:
      type: object
      required:
        - id
        - membershipId
      properties:
        id:
          type: string
          description: The caller's user ID
        membershipId:
          type: string
          description: >-
            The caller's own membership ID within this organization. This is the
            ID accepted by the [Get model roles
            endpoint](/api/user-model-roles/retrieve-user-model-roles) and is
            distinct from the user ID.
    SuggestionContextEdit:
      type: object
      required:
        - field
        - target
        - value
      properties:
        field:
          type: string
          description: The model field being edited (e.g. `ai_context`).
          example: ai_context
        target:
          type: string
          description: >-
            Dot-path identifying what the edit applies to, e.g.
            `views.orders.fields.status`.
          example: views.orders
        value:
          anyOf:
            - type: string
            - type: array
              items:
                type: string
          description: The proposed value for the field.
    SuggestionsCooldownResponse:
      type: object
      required:
        - detail
        - lastCompletedAt
        - retryAfterSeconds
        - status
      properties:
        detail:
          type: string
          description: Human-readable error message.
        lastCompletedAt:
          type: string
          format: date-time
          description: When the most recent run completed.
        retryAfterSeconds:
          type: integer
          description: Seconds to wait before a new run is allowed.
        status:
          type: integer
          example: 429
    Permission:
      type: object
      properties:
        role:
          type: string
          enum:
            - VIEWER
            - EDITOR
            - MANAGER
        accessBoost:
          type: boolean
        direct:
          type: boolean
        inherited:
          type: boolean
    FolderPermission:
      type: object
      description: Represents a folder permission in Omni.
      properties:
        id:
          type: string
          description: The ID of the user or user group.
        name:
          type: string
          description: The name of the user or user group.
        description:
          type: string
          description: Description of the permission source.
        type:
          type: string
          description: The type of the permission holder.
          enum:
            - user
            - userGroup
        direct:
          type: object
          description: Direct permission details for this folder.
          properties:
            accessBoost:
              type: boolean
              description: >-
                If `true`,
                [AccessBoost](/share#boosting-permissions-with-accessboost) is
                enabled for the user.
            isOwner:
              type: boolean
              description: If `true`, the user is the owner of the folder.
            role:
              type: string
              description: The content role associated with the user.
              enum:
                - NO_ACCESS
                - VIEWER
                - EDITOR
                - MANAGER
    DocumentAccessPrincipal:
      type: object
      description: Represents a user or group with access to a document.
      properties:
        id:
          type: string
          description: The ID of the user or user group.
        name:
          type: string
          description: Display name of the user or user group.
        email:
          type: string
          description: Email address. Only present for users, not user groups.
        type:
          type: string
          enum:
            - user
            - userGroup
          description: The type of principal.
        role:
          type: string
          enum:
            - VIEWER
            - INTERACTOR
            - EDITOR
            - MANAGER
          description: Permission level assigned to this principal.
        accessBoost:
          type: boolean
          description: Whether elevated access is enabled for this principal.
        accessSource:
          type: string
          enum:
            - direct
            - folder
          description: |
            How access was granted:
            - `direct` — Explicit document permissions
            - `folder` — Inherited from folder permissions
        isOwner:
          type: boolean
          description: >-
            Whether this user owns the document. Only present for users, not
            user groups.
        folderInfo:
          type: object
          description: >-
            Information about the folder that grants access. Only present when
            `accessSource` is `folder`.
          properties:
            id:
              type: string
              description: The ID of the folder.
            name:
              type: string
              description: The name of the folder.
            path:
              type: string
              description: The full path of the folder.
    ScimGroup:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the group
        displayName:
          type: string
          description: The name of the group
        members:
          type: array
          description: The list of users in the group
          items:
            type: object
            properties:
              value:
                type: string
                description: The user's unique identifier
              display:
                type: string
                description: The user's email address
        meta:
          type: object
          description: Metadata about the group resource
          properties:
            resourceType:
              type: string
              example: Group
              description: The type of resource. This will be `Group`.
            created:
              type: string
              format: date-time
              description: The time the group was created
            lastModified:
              type: string
              format: date-time
              description: The time the group was last updated
        schemas:
          type: array
          description: SCIM schema information for the group
          items:
            type: string
    ScimUser:
      type: object
      properties:
