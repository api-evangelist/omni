  /v1/ai/jobs/{jobId}/cancel:
    post:
      tags:
        - AI
      summary: Cancel AI job
      description: >
        Request cancellation of an AI job. This endpoint is idempotent — calling
        it on an already-cancelled or completed job returns success with the
        current state. 


        - For `QUEUED` jobs, cancellation is immediate

        - For `EXECUTING` jobs, the worker will stop after completing its
        current iteration

        - Jobs in a `DELIVERING` state cannot be cancelled as they are already
        finalizing results. **Only the job owner or organization admins can
        cancel jobs.**
      security:
        - bearerAuth: []
      operationId: cancelAIJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the AI job to cancel
      responses:
        '200':
          description: Job cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                    description: The unique identifier for the cancelled job
                  state:
                    type: string
                    enum:
                      - CANCELLED
                    description: The new state of the job
              example:
                jobId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                state: CANCELLED
        '400':
          description: |
            Bad Request

            Possible error messages:
            - `Job is not in a cancellable state`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            Unauthorized

            Possible error messages:
            - `Missing or invalid API key`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            Forbidden


            Possible error messages:

            - `Permission denied. Only the job owner or organization admins can
            cancel jobs.`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Job not found. The job may not exist or may belong to a different
            organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/ai/jobs/{jobId}/result:
    get:
      tags:
        - AI
      summary: Stream AI job results
      description: >
        Retrieve the full result of a completed AI job, including all actions
        taken by the AI (queries generated, data retrieved) and the final
        summarized answer. 


        Results are only available for jobs in `COMPLETE` state and are retained
        for 14 days after completion. The response is streamed directly from
        storage.
      security:
        - bearerAuth: []
      operationId: getAIJobResult
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the AI job
      responses:
        '200':
          description: Job results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    description: >-
                      Ordered list of actions the AI took during execution. Each
                      action represents a step such as generating a query,
                      executing it, or synthesizing a final answer.
                    items:
                      type: object
                      required:
                        - message
                        - timestamp
                        - type
                      properties:
                        type:
                          type: string
                          description: >-
                            The type of action. Common types include
                            `generate_query` (query generation and execution)
                            and `summarize` (final answer synthesis).
                          example: generate_query
                        message:
                          type: string
                          description: >-
                            The AI's explanation of what it is doing in this
                            step, written in natural language.
                          example: >-
                            I'll generate a query to find the top 5 products by
                            total revenue.
                        timestamp:
                          type: string
                          description: ISO 8601 timestamp when this action occurred.
                          example: '2025-01-15T10:00:10.000Z'
                        result:
                          type: object
                          description: >-
                            Query result data. Only present for `generate_query`
                            action types.
                          required:
                            - csvResult
                            - csvResultWasTruncated
                            - hasResults
                            - query
                            - queryName
                            - status
                            - totalRowCount
                          properties:
                            resultId:
                              type: string
                              description: >-
                                Stable, unique identifier for this query result
                                within the job. Use it to reference a specific
                                result — for example, to correlate or
                                de-duplicate results across responses.
                              example: 928c5838-000d-4943-b305-f6242c1b4922
                            queryName:
                              type: string
                              description: >-
                                Human-readable name describing what this query
                                retrieves.
                              example: Top 5 Products by Revenue
                            status:
                              type: string
                              enum:
                                - success
                                - error
                              description: Whether the query executed successfully.
                              example: success
                            query:
                              type: object
                              description: >-
                                The semantic query definition that was executed.
                                This can be used with the [Run query
                                endpoint](/api/queries/run-query) to re-run the
                                query.
                            csvResult:
                              type: string
                              description: Query results formatted as CSV text.
                              example: |-
                                Name,Total Revenue
                                Ray-Ban Sunglasses,"678,994.41"
                                Levi's 501 Jeans,"475,072.00"
                            csvResultWasTruncated:
                              type: boolean
                              description: >-
                                Whether the CSV data was truncated due to size
                                limits. If `true`, the full result set may
                                contain additional rows not included in
                                `csvResult`.
                              example: false
                            hasResults:
                              type: boolean
                              description: Whether the query returned any data rows.
                              example: true
                            totalRowCount:
                              type: integer
                              description: Total number of rows returned by the query.
                              example: 5
                  message:
                    type: string
                    description: >-
                      The AI's final response message in Markdown format. This
                      is the complete answer to the original prompt,
                      incorporating data from all executed queries.
                    example: |-
                      ### Top 5 Products by Revenue

                      1. **Sunglasses** - $678,994
                      2. **Jeans** - $475,072
                  resultSummary:
                    type: string
                    description: >-
                      Summary of the job result. Typically matches the final
                      message content.
                    example: |-
                      ### Top 5 Products by Revenue

                      1. **Sunglasses** - $678,994
                      2. **Jeans** - $475,072
                  topic:
                    type: string
                    description: The topic name used for query generation.
                    example: order_items
                  omniChatUrl:
                    type: string
                    format: uri
                    description: >-
                      URL to view this conversation in the Omni chat interface.
                      Opens the chat session where the job actions and results
                      are visible.
                    example: >-
                      https://my-org.omni.co/chat/660e8400-e29b-41d4-a716-446655440001
        '400':
          description: |
            Bad Request

            Possible error messages:
            - `Invalid job ID`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            Unauthorized

            Possible error messages:
            - `Missing or invalid API key`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Job not found or results not available

            Possible error messages:
            - `Job not found`
            - `Job results not yet available`
            - `Result is no longer available`. Results are retained for 14 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/ai/eval/prompt-sets:
    get:
