    post:
      tags:
        - Schedule recipients
      summary: Manage email-only user
      x-mint:
        content: >
          Creates or updates an [email-only user](/share/deliveries/email). An
          email-only user is a recipient of a delivery that isn't associated
          with an Omni account.


          If Omni matches the provided email to an existing email-only user, the
          user will be updated according to the `userAttributes` in the request
          body.


          <Tip>
            Need to include multiple email-only users? Use the [Create or update multiple email-only users](/api/schedule-recipients/bulk-manage-email-only-users) endpoint.
          </Tip>
      security:
        - orgApiKey: []
      operationId: manageEmailOnlyUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: The user's email address.
                userAttributes:
                  type: object
                  description: >
                    An object defining the user's [user
                    attributes](/administration/users/attributes). Attributes
                    are represented as key/value pairs, where the keys map to
                    the IDs of user attributes (the **Reference** column in the
                    **User attributes** page) defined in Omni.


                    When providing user attributes, note that:


                    - `omni_user_timezone` is the only supported system
                    attribute

                    - **Values must match the user attribute's specified type**.
                    For example, `number` attribute values must be numbers such
                    as `1`, `10`, etc.

                    - **Multi-value attributes should be provided using
                    arrays**. For example: `["US","EU"]` or `[1, 10]`


                    To unset attributes:


                    - `null` values

                    - `""` - Empty strings for string attributes

                    - `[]` - Empty arrays for multi-value attributes
            examples:
              basic:
                summary: Basic request
                value:
                  email: iamagoodblob@blobsrus.co
              withAttributes:
                summary: Set user attributes
                value:
                  email: iamagoodblob@blobsrus.co
                  userAttributes:
                    region:
                      - US
                      - EU
                    omni_user_timezone: America/New_York
                    is_admin: 0
                    is_sales_team: 1
              unsetAttributes:
                summary: Unset user attributes
                value:
                  email: iamagoodblob@blobsrus.co
                  userAttributes:
                    is_admin: null
                    is_sales_team: ''
                    region: []
      responses:
        '200':
          description: Email-only user created or updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email
                    description: The email address of the created or updated user.
                  userId:
                    type: string
                    format: uuid
                    description: The unique identifier of the email-only user.
              example:
                email: iamagoodblob@blobsrus.co
                userId: 9e8719d9-276a-4964-9395-a493189a247c
        '400':
          description: >
            Bad Request. Possible error messages include:


            - `Invalid JSON`

            - `email: email is required`

            - `email: Invalid email address`

            - `The provided user attributes: "<attribute>" do not match the
            names of existing user attributes.`

            - `User Attribute <attribute> is type number, but passed-in value
            <value> is not a number.`

            - `The timezone <invalidTimezone> is not supported. Please see the
            connection page or [user profile
            page](/administration/users/your-account) for the list of valid
            timezones. Use e.g. "America/New_York" instead of "EST"`

            - `User Attribute <attribute> has multiple values enabled, but the
            passed-in value is not an array. If passing a single value for a
            user attribute with multiple values enabled, please wrap the value
            in an array [x].`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/users/email-only/bulk:
    post:
      tags:
        - Schedule recipients
      summary: Bulk manage email-only users
      description: >
        Creates or updates up to 20 [email-only users](/share/deliveries/email).
        An email-only user is a recipient of a delivery that isn't associated
        with an Omni account.


        If Omni matches a provided email to an existing email-only user, the
        user will be updated according to the `userAttributes` in the request
        body.
      security:
        - orgApiKey: []
      operationId: bulkManageEmailOnlyUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - users
              properties:
                users:
                  type: array
                  maxItems: 20
                  description: >
                    An array of user objects, which includes `email` and
                    `userAttributes` properties. Up to 20 users can be included
                    in each request.
                  items:
                    type: object
                    required:
                      - email
                    properties:
                      email:
                        type: string
                        format: email
                        description: The user's email address.
                      userAttributes:
                        type: object
                        description: >
                          An object defining the user's [user
                          attributes](/administration/users/attributes).
                          Attributes are represented as key/value pairs, where
                          the keys map to the IDs of user attributes (the
                          **Reference** column in the **User attributes** page)
                          defined in Omni.


                          When providing user attributes, note that:


                          - `omni_user_timezone` is the only supported system
                          attribute

                          - **Values must match the user attribute's specified
                          type**. For example, `number` attribute values must be
                          numbers such as `1`, `10`, etc.

                          - **Multi-value attributes should be provided using
                          arrays**. For example: `["US","EU"]` or `[1, 10]`


                          To unset attributes:


                          - `null` values

                          - `""` - Empty strings for string attributes

                          - `[]` - Empty arrays for multi-value attributes
            examples:
              basic:
                summary: Basic request
                value:
                  users:
                    - email: iamagoodblob@blobsrus.co
                    - email: blobmanager@blobsrus.co
              withAttributes:
                summary: Set user attributes
                value:
                  users:
                    - email: iamagoodblob@blobsrus.co
                      userAttributes:
                        region:
                          - US
                          - EU
                        omni_user_timezone: America/New_York
                        is_admin: 0
                        is_sales_team: 1
                    - email: blobmanager@blobsrus.co
                      userAttributes:
                        region:
                          - US
                        omni_user_timezone: America/New_York
                        is_admin: 1
                        is_sales_team: 0
              unsetAttributes:
                summary: Unset user attributes
                value:
                  users:
                    - email: iamagoodblob@blobsrus.co
                      userAttributes:
                        region: []
                        omni_user_timezone: ''
                        is_admin: null
      responses:
        '200':
          description: Email-only users created or updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    description: An array of created or updated email-only users.
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          format: email
                          description: The email address of the created or updated user.
                        userId:
                          type: string
                          format: uuid
                          description: The unique identifier of the email-only user.
              example:
                results:
                  - email: iamagoodblob@blobsrus.co
                    userId: 1e23dadc-961b-4a21-b36b-17168130fc3f
                  - email: blobmanager@blobsrus.co
                    userId: e9d19f71-0b59-4f8e-8343-a75d30576d28
        '400':
          description: >
            Bad Request. Possible error messages include:


            - `Invalid JSON`

            - `users: Maximum of 20 users can be processed in a single request`

            - `users: users is required`

            - `email: email is required`

            - `email: Invalid email address`

            - `The provided user attributes: "<attribute>" do not match the
            names of existing user attributes.`

            - `User Attribute <attribute> is type number, but passed-in value
            <value> is not a number.`

            - `The timezone <invalidTimezone> is not supported. Please see the
            connection page or [user profile
            page](/administration/users/your-account) for the list of valid
            timezones. Use e.g. "America/New_York" instead of "EST"`

            - `User Attribute <attribute> has multiple values enabled, but the
            passed-in value is not an array. If passing a single value for a
            user attribute with multiple values enabled, please wrap the value
            in an array [x].`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/user-attributes:
    get:
      tags:
