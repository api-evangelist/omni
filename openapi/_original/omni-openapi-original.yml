                    - `ssh` for deploy key
                    - `https_token` for deploy token/PAT
                  example: ssh
                cloneUrl:
                  type: string
                  description: >
                    Clone URL of the git repository. Varies depending on the
                    `authMethod`:


                    - `ssh` - A string starting with `git@...`

                    - `https_token` - A string starting with `https://...`
                  example: git@github.com:org/repo.git
                sshUrl:
                  type: string
                  deprecated: true
