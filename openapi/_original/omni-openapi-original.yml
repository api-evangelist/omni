    put:
      tags:
        - Users
      summary: Replace user
      description: >
        Replaces the specified user. Per the SCIM 2.0 specification, `PUT`
        replaces the entire user resource: any optional attribute omitted from
        the request body is reset to its default value.


        To update individual attributes without affecting others, use the
        [Update user](/api/users/update-user) endpoint, which performs a partial
        update via `PATCH`.
      security:
        - orgApiKey: []
      operationId: replaceUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user to be replaced
          example: 9e8719d9-276a-4964-9395-a493189a247c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
              properties:
                active:
                  type: boolean
                  default: true
                  description: >-
                    Whether the user is active. Set to `false` to deactivate the
                    user.
                  example: true
                displayName:
                  type: string
                  description: The user's display name
                  example: Blob Ross
                userName:
                  type: string
                  format: email
                  description: The user's email address.
                  example: blob.ross@blobsrus.co
                urn:omni:params:1.0:UserAttribute:
                  type: object
                  description: >
                    [User attributes](/administration/users/attributes) as
                    key/value pairs, where keys map to the IDs of user
                    attributes defined in Omni. This is the **Reference** column
                    in the **User attributes** page.
                  example:
                    good_blob: 'yes'
      responses:
        '200':
          description: User replaced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimUser'
              example:
