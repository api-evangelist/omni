    put:
      tags:
        - Document favorites
      summary: Favorite document
      description: >
        Add a document to a user's favorites. Only published documents can be
        favorited.


        **Note**: Successful requests will return `204` regardless of whether
        the document is newly favorited or already in the user's favorites.
      security:
