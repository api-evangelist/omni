      summary: List eval prompt sets
      tags:
        - AI Eval
      parameters:
        - schema:
            type: string
            enum:
              - 'true'
              - 'false'
            description: >-
              When `true`, returns archived prompt sets instead of active ones.
              Defaults to `false`.
            example: 'false'
          required: false
          description: >-
            When `true`, returns archived prompt sets instead of active ones.
            Defaults to `false`.
          name: archived
          in: query
        - schema:
            type: array
            items:
              type: string
              format: uuid
            description: >-
              Optional list of model IDs to filter prompt sets by. When omitted,
              returns prompt sets for every model the caller can access. Supply
              multiple times to filter by more than one model (e.g.,
              `?model_ids=A&model_ids=B`).
          required: false
          description: >-
            Optional list of model IDs to filter prompt sets by. When omitted,
            returns prompt sets for every model the caller can access. Supply
            multiple times to filter by more than one model (e.g.,
            `?model_ids=A&model_ids=B`).
          name: model_ids
          in: query
      responses:
        '200':
          description: List of prompt sets, sorted alphabetically by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalPromptSetsListResponse'
        '400':
          description: >-
            Invalid query params (e.g. `model_ids` contains a non-UUID, or
            `archived` is not `true`/`false`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalApiError'
              example: &ref_0
                detail: 'Bad Request: name: Required'
                status: 400
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalApiError'
              example: &ref_1
                detail: 'Unauthorized: Missing or invalid API key'
                status: 401
        '403':
          description: >-
            Insufficient permissions. The caller must have at least the Querier
            role on each requested model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalApiError'
              example: &ref_2
                detail: AI eval requires at least Querier access on the model
                status: 403
        '404':
          description: No eval-accessible models for this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalApiError'
              example: &ref_3
                detail: Prompt set not found
                status: 404
    post:
      description: >-
        Create a new eval prompt set bound to a shared model. Initial prompts
