      summary: Update document permission settings
      description: >
        Updates the permission and [interactivity
        settings](/share#controlling-document-interactivity) for a document. For
        example, the ability to allow users to schedule or download the
        document's content.
      security:
        - bearerAuth: []
      operationId: updateDocumentSettings
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >
            The document identifier. To retrieve the ID, navigate to **File >
            Document settings** in the document and then click **Settings**. The
            **Identifier** field contains the document ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationRole:
                  type: string
                  enum:
                    - NO_ACCESS
                    - VIEWER
                    - EDITOR
                    - MANAGER
                  description: >
                    The default content role for the organization. Must be one
                    of:

                    - `NO_ACCESS` - No access. Document won't appear in content
                    system or search results.

                    - `VIEWER` - View dashboard

                    - `EDITOR` - Edit dashboard and workbook

                    - `MANAGER` - Edit dashboard and workbook and manage
                    permissions
                canDownload:
                  type: boolean
                  description: >-
                    If `true`, users with required permissions will be able to
                    [download the document's query
                    results](/analyze-explore/point-click-queries#downloading-results)
                    or [dashboards](/visualize-present/dashboards/download). In
                    the UI, this is the **Download** setting in the document's
                    settings.
                canDrill:
                  type: boolean
                  description: >-
                    If `true`, users with required permissions will be able to
                    drill into data points in the document's content. In the UI,
                    this is the **Drill** setting in the document's settings.
                canSchedule:
                  type: boolean
                  description: >-
                    If `true`, users with required permissions will be able to
                    create [deliveries (schedules and
                    alerts)](/share/deliveries) on the document. In the UI, this
                    is the **Schedule** setting in the document's settings.
                canUpload:
                  type: boolean
                  description: >
                    If `true`, users with required permissions can [upload
                    data](/analyze-explore/data-input-csvs) (ex: CSVs) into the
                    document to create data input tables. In the UI, this is the
                    **Upload data** setting in the document's settings.
                canViewWorkbook:
                  type: boolean
                  description: >-
                    If `true`, users with required permissions can view a
                    read-only version of the workbook. In the UI, this is the
                    **Viewers can see workbook** setting in the document's
                    settings.
      responses:
        '200':
          description: Settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: |
            Bad Request. Possible causes:

            - Invalid parameter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: '<parameter>: Invalid <parameter>'
                status: 400
        '403':
          description: >
            Forbidden. The user sending the API request must have **Manager**
            permissions for the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: User does not have permission to manage document permissions
                status: 403
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Document with identifier "<documentId>" not found
                status: 404
        '429':
          $ref: '#/components/responses/TooManyRequests'
