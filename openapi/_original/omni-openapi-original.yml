            application/json:
              schema:
                type: object
                required:
                  - pageInfo
                  - records
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/Routine'
                    description: Routines returned for this request, newest first.
        '400':
          description: Invalid pagination cursor or `userId` value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError400'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            Forbidden


            Possible error messages:


            - `User does not have USE_AI permission`

            - `AI Routines feature is not enabled (aiScheduledTasks flag
            required)`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not found.

            Possible causes:

            - The `userId` membership was not found in the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError404'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create an AI Routine
      description: >
        <Note>
          AI routines must be enabled for your organization to use this endpoint.
        </Note>


        Create a new AI Routine that will run on the specified schedule.


        Each scheduled run executes once using the routine owner's permissions,
        and every recipient receives the same result.
      operationId: routineCreate
      tags:
        - AI Routines
      parameters:
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
          required: false
          description: |
            **Requires an Organization API key**. Target user membership ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - modelId
                - prompt
                - schedule
                - timezone
                - destination
              properties:
                branchId:
                  type: string
                  nullable: true
                  format: uuid
                  description: Branch of the shared model the prompt runs against, or null.
                description:
                  type: string
                  nullable: true
                  description: Display-only notes about the routine, or null.
                destination:
                  $ref: '#/components/schemas/RoutineDestination'
                modelId:
                  type: string
                  format: uuid
                  description: The shared model the prompt runs against.
                name:
                  type: string
                  description: >-
                    Customer-visible name of the routine, used as the email
                    subject.
                prompt:
                  type: string
                  description: Natural language prompt Omni runs on each scheduled run.
                schedule:
                  type: string
                  description: >-
                    Six-field cron expression (minute, hour, day-of-month,
                    month, day-of-week, year; use `?` for an unspecified day
                    field).
                timezone:
                  type: string
                  description: IANA timezone identifier used to evaluate the schedule.
                topicName:
                  type: string
                  nullable: true
                  description: Topic scoping query generation, or null.
      responses:
        '201':
          description: Routine created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The unique identifier for the newly created routine.
                    example: 880e8400-e29b-41d4-a716-446655440003
        '400':
          description: >-
            Invalid request body, recipient configuration, timezone, or
            schedule. Also returned when the schedule is more frequent than the
            organization allows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError400'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            Forbidden


            AI routines or AI query generation are not enabled for the
            organization, or the API key cannot act on behalf of the requested
            user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Model, branch, or topic not found, or not accessible to the
            requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError404'
        '429':
          description: The resolved user already has the maximum number of active routines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError429'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/ai/routines/{routineId}:
