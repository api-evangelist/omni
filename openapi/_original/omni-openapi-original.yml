            - `<topic_name>.topic` - [Topic file](/modeling/topics/parameters)
            - `<view_name>.view` - [View file](/modeling/views)
        - name: branchId
          in: query
          schema:
            type: string
            format: uuid
          description: >
            **Required if git pull requests are required for the model.** The ID
            of the branch to delete from. To retrieve branch IDs, use the [List
