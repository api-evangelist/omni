    put:
      summary: Update an AI Routine
      description: >
        <Note>
          AI routines must be enabled for your organization to use this endpoint.
        </Note>


        Update an existing AI Routine. All request fields are optional, and only
        supplied fields are changed. Supplying `destination` replaces the full
