              example: *ref_3
  /v1/ai/eval/runs/{runId}/cancel:
    post:
      description: >-
        Cancel an in-flight eval run. Marks the run cancelled first so no
        in-progress per-prompt job can flip it back to COMPLETE, then cancels
        every non-terminal agentic job associated with the run. The run is also
        archived as part of the cancel — the response returns the updated run
        inline (`status: CANCELLED`, `is_archived: true`); use `/unarchive` to
        surface it in the default `archived=false` list again.
      operationId: aiEvalRunsCancel
      summary: Cancel an eval run
      tags:
        - AI Eval
      parameters:
        - schema:
            type: string
            format: uuid
            description: The unique identifier of the eval run.
            example: 660e8400-e29b-41d4-a716-446655440001
          required: true
          description: The unique identifier of the eval run.
