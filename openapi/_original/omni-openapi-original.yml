    SchemaRefreshSchedule:
      type: object
      properties:
        scheduleId:
          type: string
          format: uuid
          description: The unique identifier of the schema refresh schedule
        connectionId:
          type: string
          format: uuid
          description: The unique identifier of the connection this schedule belongs to
        schedule:
          type: string
          description: >
            A 6-field cron expression in AWS EventBridge format defining when
            the schema refresh should run.


            Format: `minute hour day-of-month month day-of-week year`
        timezone:
          type: string
          description: The IANA timezone identifier for when the schedule should run
        description:
          type: string
          description: >-
            A human-readable description of the schedule, automatically
            generated from the cron expression and timezone
        hardRefresh:
          type: boolean
          default: false
          description: >-
            Whether the scheduled refresh performs a hard refresh (removes
            dropped objects) or soft refresh (additive only). Defaults to false
            (soft refresh).
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the schedule was created
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the schedule was last updated
        disabledAt:
          type: string
          format: date-time
          nullable: true
          description: The timestamp when the schedule was disabled, or `null` if active
    DbtEnvironment:
