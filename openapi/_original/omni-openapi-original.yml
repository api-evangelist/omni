            Possible error messages:

            - `Bad Request: Invalid modelId format`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Shared model or branch model does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
