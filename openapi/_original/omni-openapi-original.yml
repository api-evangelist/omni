    patch:
      tags:
        - User groups
      summary: Update user group
      description: >
        Updates the specified user group by applying a list of [SCIM 2.0 patch
        operations](https://datatracker.ietf.org/doc/html/rfc7644#section-3.5.2).
        Use `PATCH` to add or remove individual members, or to rename the group,
        without affecting other attributes.


        To replace the entire group resource (including the full membership
        list) in a single request, use the [Replace user
        group](/api/user-groups/replace-user-group) endpoint.
      security:
        - orgApiKey: []
      operationId: updateUserGroup
      parameters:
        - name: userGroupId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the group to be updated
          example: mEhXj6ZI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - Operations
                - schemas
              properties:
                schemas:
                  type: array
                  description: >-
                    The SCIM schema URIs for the request. Must include
                    `urn:ietf:params:scim:api:messages:2.0:PatchOp`.
                  items:
                    type: string
                    enum:
                      - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  example:
                    - urn:ietf:params:scim:api:messages:2.0:PatchOp
                Operations:
                  type: array
                  minItems: 1
                  description: >
                    The list of patch operations to apply to the group.
                    Supported operations:


                    | Operation | Description |

                    |-----------|-------------|

                    | `add` with `path: "members"` | Add one or more users to
                    the group |

                    | `remove` with `path: 'members[value eq "{userId}"]'` |
                    Remove a single user from the group |

                    | `replace` with `path: "displayName"` | Rename the group |

                    | `replace` with `path: "members"` | Replace the entire
                    membership list |

                    | `replace` without a `path` | Replace top-level attributes
                    (for example, `displayName`) |
                  items:
                    type: object
                    required:
                      - op
                    properties:
                      op:
                        type: string
                        description: The operation to perform.
                        enum:
                          - add
                          - replace
                          - remove
                      path:
                        type: string
                        description: >
                          The attribute path the operation targets. For member
                          removal, use the filter syntax `members[value eq
                          "{userId}"]`. Omit to apply the operation to the
                          resource as a whole.
                        example: members
                      value:
                        description: >-
                          The value to apply for the operation. Required for
                          `add` and `replace` operations.
            examples:
              addMembers:
                summary: Add members to the group
                value:
                  schemas:
                    - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                    - op: add
                      path: members
                      value:
                        - display: blob.ross@blobsrus.co
                          value: 9e8719d9-276a-4964-9395-a493189a247c
              removeMember:
                summary: Remove a member from the group
                value:
                  schemas:
                    - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                    - op: remove
                      path: members[value eq "9e8719d9-276a-4964-9395-a493189a247c"]
              renameGroup:
                summary: Rename the group
                value:
                  schemas:
                    - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                    - op: replace
                      path: displayName
                      value: Blob SEs
      responses:
        '200':
          description: Group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
              example:
                displayName: Blob SEs
                id: mEhXj6ZI
                meta:
                  created: '2024-12-04T00:08:03.250Z'
                  lastModified: '2024-12-04T00:20:47.346Z'
                  resourceType: Group
                schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:Group
                members:
                  - display: blob.ross@blobsrus.co
                    value: 9e8719d9-276a-4964-9395-a493189a247c
        '400':
          description: Invalid patch operations
        '429':
          $ref: '#/components/responses/TooManyRequests'
