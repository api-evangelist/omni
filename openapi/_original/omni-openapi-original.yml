  /v1/schedules/{scheduleId}/transfer-ownership:
    put:
      tags:
        - Schedules
      summary: Transfer schedule ownership
      x-mint:
        content: >
          Transfers ownership of a schedule from one user to another user in the
          same organization. New ownership will be immediate and can't be
          reversed using this endpoint.


          How ownership transfer affects schedule execution depends on the type
          of destination the schedule uses, and for email destinations, whether
          the **Personalize delivery with the recipient's user attributes** is
          enabled:


          |                                                                    
          | Slack, SFTP, &amp; Webhooks | Email without personalization | Email
          with personalization |

          |---------------------------------------------------------------------|-----------------------------|-------------------------------|----------------------------|

          | **Future jobs are executed by...**                                 
          | New owner                   | New owner                     | Each
          recipient             |

          | **Permissions, data access, &amp; user attributes are based on...**
          | New owner                   | New owner                     | Each
          recipient             |

          | **Output is generated using...**                                   
          | New owner access            | New owner access              |
          Recipient access           |
      security:
        - bearerAuth: []
      operationId: transferScheduleOwnership
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: >
            The ID of the schedule. To find a schedule's ID:


            1. Navigate to the dashboard of a document.

            2. Click **File > Deliveries & Alerts**.

            3. Next to a schedule, click **Edit**.


            The schedule's ID is in the page's URL, after `/schedules/`. For
            example, the schedule ID in this URL is
            `123e4567-e89b-12d3-a456-426614174000`:


            ```markdown

            https://blobsrus.omniapp.co/dashboards/e23ebaa0/schedules/123e4567-e89b-12d3-a456-426614174000

            ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  format: uuid
                  description: >
                    The ID of the user to transfer schedule ownership to. Use
                    the [List users](/api/users/list-users) endpoint to retrieve
                    user IDs.


                    The new owner must:


                    - Be a member of the same organization

                    - Not be the current owner

                    - Have permission to view the dashboard associated with the
                    schedule
      responses:
        '200':
          description: Ownership transferred successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: |
            Bad Request

            Possible error messages:

            - `userId: Invalid uuid`
            - `userId is a required field`
            - `User already owns the schedule`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Forbidden

            Possible error messages:

            - `New owner does not have permission to view the dashboard`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Scheduled task with id <scheduleId> does not exist`
            - `New owner is not a member of the organization`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
