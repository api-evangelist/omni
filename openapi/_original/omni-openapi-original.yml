        createdAt:
          type: string
          format: date-time
          example: '2026-06-01T14:30:00.000Z'
          description: The time the connection was created.
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-11T10:15:30.000Z'
          description: The time the connection was last updated.
        deletedAt:
          type: string
          format: date-time
