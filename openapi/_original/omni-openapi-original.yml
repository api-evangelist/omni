  /v1/models/{modelId}/view/{viewName}:
    delete:
      tags:
        - Models
      summary: Delete view
      description: >
        Deletes or ignores a view from a model extension layer. Use the `mode`
        parameter to specify the behavior of this endpoint.
      security:
        - bearerAuth: []
      operationId: deleteView
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the model.
        - name: viewName
          in: path
          required: true
          schema:
            type: string
          description: The name of the view to delete or ignore.
        - name: branchId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional branch ID
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum:
              - COMBINED
              - MERGED
              - EXTENSION
            default: EXTENSION
          description: >
            Controls how the view is deleted or hidden:


            - `COMBINED` — **Default**. Marks the view as ignored (`ignored:
            true`) if it exists in the parent model, otherwise hard-deletes

            - `EXTENSION` — Hard-deletes the view from the extension layer

            - `MERGED` — Marks the view as `shallowIgnored: true`, hiding it
            only from the immediate parent layer
      responses:
        '200':
          description: View deleted or ignored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: |
            Bad Request

            Possible error messages:

            - `Bad Request: Invalid modelId format`
            - `Bad Request: Invalid mode parameter`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Model not found`
            - `View not found`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
