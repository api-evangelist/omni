                groups: []
                id: 9e8719d9-276a-4964-9395-a493189a247c
                meta:
                  created: '2024-12-03T23:13:14.109Z'
                  lastModified: '2024-12-03T23:13:14.109Z'
                  resourceType: User
                schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                userName: blob.ross@blobsrus.co
                urn:omni:params:1.0:UserAttribute:
                  good_blob: 'yes'
        '400':
          description: Invalid request body
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Users
      summary: Update user
      description: >
        Updates the specified user by applying a list of [SCIM 2.0 patch
        operations](https://datatracker.ietf.org/doc/html/rfc7644#section-3.5.2).
        Attributes not referenced in the request are left unchanged.


        To replace the entire user resource in a single request, use the
        [Replace user](/api/users/replace-user) endpoint.
      security:
        - orgApiKey: []
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user to be updated
          example: 9e8719d9-276a-4964-9395-a493189a247c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - Operations
                - schemas
              properties:
                schemas:
                  type: array
                  description: >-
                    The SCIM schema URIs for the request. Must include
                    `urn:ietf:params:scim:api:messages:2.0:PatchOp`.
                  items:
                    type: string
                    enum:
                      - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  example:
                    - urn:ietf:params:scim:api:messages:2.0:PatchOp
                Operations:
                  type: array
                  minItems: 1
                  description: The list of patch operations to apply to the user.
                  items:
                    type: object
                    required:
                      - op
                      - value
                    properties:
                      op:
                        type: string
                        description: The operation to perform.
                        enum:
                          - add
                          - replace
                          - remove
                      path:
                        type: string
                        description: >
                          The attribute path the operation targets. Omit to
                          apply the operation to the resource as a whole.
                        example: displayName
                      value:
                        description: >-
                          The value to apply for the operation. Required for
                          `add` and `replace` operations.
                        example: Blob Ross
                        anyOf:
                          - type: string
                          - type: number
                          - type: boolean
                          - type: array
                            items:
                              type: string
                          - type: object
                            properties:
                              active:
                                type: boolean
                              displayName:
                                type: string
                              userName:
                                type: string
                                format: email
            examples:
              deactivateUser:
                summary: Deactivate a user
                value:
                  schemas:
                    - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                    - op: replace
                      path: active
                      value: false
              updateDisplayNameAndEmail:
                summary: Update display name and email
                value:
                  schemas:
                    - urn:ietf:params:scim:api:messages:2.0:PatchOp
                  Operations:
                    - op: replace
                      value:
                        displayName: Blob Ross
                        userName: blob.ross@blobsrus.co
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimUser'
              example:
                active: false
                displayName: Blob Ross
                emails:
                  - primary: true
                    value: blob.ross@blobsrus.co
                groups: []
                id: 9e8719d9-276a-4964-9395-a493189a247c
                meta:
                  created: '2024-12-03T23:13:14.109Z'
                  lastModified: '2024-12-03T23:13:14.109Z'
                  resourceType: User
                schemas:
                  - urn:ietf:params:scim:schemas:core:2.0:User
                userName: blob.ross@blobsrus.co
        '400':
          description: Invalid patch operations
        '429':
          $ref: '#/components/responses/TooManyRequests'
