          description: Prompt set created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalPromptSetsCreateResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalApiError'
