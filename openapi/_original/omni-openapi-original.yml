    patch:
      tags:
        - Documents
      summary: Update document
      deprecated: true
      description: >
        <Warning>
          **Deprecated** — Removal scheduled for **July 31, 2026**. Use the [Documents v2 API](/api/documents-v2/create-document) instead.
        </Warning>


        Updates the name, description, and/or identifier of a document.
        **Note**: At least one of `name`, `description`, or `identifier` must be
        provided or the API will return a `Bad Request` error.


        Renaming a document follows the app's draft/publish workflow:


        | Document Type | Behavior |

        |---------------|----------|

        | **Draft** | Renamed directly |

        | **Published (no existing draft)** | Creates draft > Renames draft >
        Publishes draft |

        | **Published (existing draft, `clearExistingDraft: true`)** | Discards
        existing draft > Creates new draft > Renames > Publishes |

        | **Published (existing draft, `clearExistingDraft` not set)** | Returns
        `409 Conflict` |
      security:
        - bearerAuth: []
      operationId: renameDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: Document identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: New name for the document.
                description:
                  type: string
                  maxLength: 1024
                  description: >-
                    Updated description of the document. Set as `null` to clear
                    the description.
                clearExistingDraft:
                  type: boolean
                  description: >
                    If `true`, discards any existing draft before renaming.


                    **Note**: This parameter is required when a draft exists for
                    the document.
                identifier:
                  type: string
                  description: >
                    New identifier for the document. Renaming the identifier
                    works with published documents and maintains old URLs via
                    automatic redirects.


                    When you change a document's identifier:

                    - Both the workbook and document identifiers are updated in
                    one transaction

                    - A `DocumentIdentifierHistory` entry is created so requests
                    to the old identifier automatically redirect to the new one

                    - Dashboard and document history entries are updated


                    **Format requirements:**

                    - Must match the pattern: lowercase letters, numbers,
                    hyphens, and underscores only

                    - Cannot start or end with a hyphen or underscore

                    - Must be unique across all documents in your organization


                    **Common use case:** Migrating content between environments
                    (e.g., staging → production) while maintaining specific
                    identifiers.
                  example: sales-dashboard-archived
            examples:
              renameIdentifier:
                summary: Rename document identifier only
                value:
                  identifier: sales-dashboard-archived
              updateNameAndIdentifier:
                summary: Update both name and identifier
                value:
                  name: Q2 2026 Sales Report
                  identifier: q2-sales-report
              renameName:
                summary: Rename document name only
                value:
                  name: Updated Dashboard Name
      responses:
        '200':
          description: Document renamed successfully
          headers:
            Deprecation:
              description: Indicates that this endpoint is deprecated
              schema:
                type: string
                example: 'true'
            Sunset:
              description: The date this endpoint will be removed (RFC 9110)
              schema:
                type: string
                format: date
                example: '2026-07-31'
            Link:
              description: Link to the replacement API (RFC 8288)
              schema:
                type: string
                example: >-
                  </api/documents-v2/create-draft-and-patch-document>;
                  rel="successor-version"
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    description: The document identifier
                  name:
                    type: string
                    description: The new document name
              examples:
                renameIdentifier:
                  summary: Rename document identifier
                  value:
                    identifier: sales-dashboard-archived
                    name: Sales Dashboard
                updateNameAndIdentifier:
                  summary: Update both name and identifier
                  value:
                    identifier: q2-sales-report
                    name: Q2 2026 Sales Report
        '400':
          description: >
            Bad Request. Possible causes:


            - Request body must have `name`, `description`, or `identifier`

            - Name exceeds 255 characters

            - Description exceeds 1024 characters

            - Identifier format is invalid (must be lowercase letters, numbers,
            hyphens, and underscores; cannot start/end with hyphen or
            underscore)

            - Identifier is already in use by another document

            - Draft already exists - set clearExistingDraft to true to discard
            it and proceed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User has insufficient permissions to update document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >
            Conflict. Published document has an existing draft and
            `clearExistingDraft` is not set to `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Documents
      summary: Update dashboard document
      deprecated: true
      description: >
        <Warning>
          **Deprecated** — Removal scheduled for **July 31, 2026**. Use the [Documents v2 API](/api/documents-v2/create-document) instead.
        </Warning>


        <Warning>
          This endpoint only works with dashboard documents. Workbook-only documents are not supported.
        </Warning>


        Updates a document with the specified identifier. This endpoint performs
        a full resource replacement — all required fields must be provided and
        existing query presentations are replaced entirely.
      x-mint:
        content: >
          The update operation follows the Omni's [draft/publish
          workflow](/content/develop):


          | Document Type | Behavior |

          |---------------|----------|

          | **Draft** | Updated directly |

          | **Published (no existing draft)** | Creates draft > Updates draft >
          Publishes draft |

          | **Published (existing draft, `clearExistingDraft: true`)** |
          Discards existing draft > Creates new draft > Updates > Publishes |

          | **Published (existing draft, `clearExistingDraft` not set)** |
          Returns `409 Conflict` |


          This endpoint follows Omni's draft/publish workflow. Updates to
          published documents create a draft, apply changes, then publish. Use
          the `clearExistingDraft` parameter to discard any existing draft
          before updating.
      security:
        - bearerAuth: []
      operationId: updateDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: Document identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - modelId
                - name
                - facetFilters
                - refreshInterval
                - filterConfig
                - filterOrder
                - queryPresentations
              properties:
                modelId:
                  type: string
                  description: Model ID for query transformation
                name:
                  type: string
                  minLength: 1
                  maxLength: 254
                  description: Document name
                description:
                  type: string
                  maxLength: 1024
                  description: >-
                    Optional description of the document. Set as `null` to clear
                    the description.
                  example: Total monthly sales. Used in sales review meetings.
                facetFilters:
                  type: boolean
                  description: When `true`, enable facet filters on the dashboard
                refreshInterval:
                  oneOf:
                    - type: integer
                      minimum: 60
                    - type: 'null'
                  description: >-
                    Auto-refresh interval in seconds. Minimum value must be
                    `60`. Use `null` to disable.
                filterConfig:
                  type: object
                  description: >
                    Dashboard filter configuration. Pass `{}` for no filters.


                    Each key is a field name and the value is a filter
                    definition object.
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Field type (e.g., "string", "number")
                      kind:
                        type: string
                        description: Filter kind (e.g., "EQUALS", "GREATER_THAN")
                      values:
                        type: array
                        items: {}
                        description: Filter values
                      is_negative:
                        type: boolean
                        description: When `true`, negate the filter condition
                filterOrder:
                  type: array
                  items:
                    type: string
                  description: Order of filters in the filter bar. Pass `[]` if no filters.
                queryPresentations:
                  type: array
                  minItems: 1
                  description: Array of query presentations (at least one required)
                  items:
                    type: object
                    required:
                      - name
                      - query
                    properties:
                      name:
                        type: string
                        description: Name of the query tab
                      query:
                        type: object
                        required:
                          - fields
                          - table
                        properties:
                          fields:
                            type: array
                            items:
                              type: string
                            description: Array of field names to include in the query
                          table:
                            type: string
                            description: Table name for the query
                        description: Query definition
                      description:
                        type: string
                        description: Query description
                      subTitle:
                        type: string
                        description: Subtitle for the query
                      prefersChart:
                        type: boolean
                        description: When `true`, show chart by default
                      topicName:
                        type: string
                        description: Topic name for the query
                      chartType:
                        oneOf:
                          - type: string
                          - type: 'null'
                        description: Chart type (line, bar, etc.)
                      visConfig:
                        type: object
                        description: Full visualization configuration
                      resultConfig:
                        type: object
                        description: Result display configuration
                      aiConfig:
                        type: object
                        description: AI configuration
                documentMetadata:
                  type: object
                  description: Document metadata for presentation settings
                  properties:
                    presentation:
                      type: object
                      properties:
                        filters:
                          type: object
                          properties:
                            collapsible:
                              type: boolean
                              description: Whether filters are collapsible
                            defaultExpanded:
                              type: boolean
                              description: Whether filters are expanded by default
                clearExistingDraft:
                  type: boolean
                  description: >
                    If `true`, discards any existing draft before updating.


                    **Note**: This parameter is required when a draft exists for
                    the document.
            example:
              modelId: abc123
              name: Monthly Sales Dashboard
              description: Total monthly sales. Used in sales review meetings.
              facetFilters: true
              refreshInterval: null
              filterConfig:
                order_items.category:
                  type: string
                  kind: EQUALS
                  values:
                    - Electronics
                  is_negative: false
              filterOrder:
                - order_items.category
              queryPresentations:
                - name: Sales Trend
                  description: Monthly sales over time
                  prefersChart: true
                  topicName: order_items
                  query:
                    fields:
                      - order_items.created_at[month]
                      - order_items.sale_price_sum
                    table: order_items
                  visConfig:
                    visType: basic
                    spec:
                      mark:
                        type: line
              documentMetadata:
                presentation:
                  filters:
                    collapsible: true
                    defaultExpanded: false
      responses:
        '200':
          description: Document updated successfully
          headers:
            Deprecation:
              description: Indicates that this endpoint is deprecated
              schema:
                type: string
                example: 'true'
            Sunset:
              description: The date this endpoint will be removed (RFC 9110)
              schema:
                type: string
                format: date
                example: '2026-07-31'
            Link:
              description: Link to the replacement API (RFC 8288)
              schema:
                type: string
                example: </api/documents-v2/create-document>; rel="successor-version"
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    description: The document identifier
                  name:
                    type: string
                    description: The updated document name
                  description:
                    type: string
                    description: The updated document description
              example:
                identifier: my-dashboard
                name: Q4 Sales Dashboard
                description: Total monthly sales. Used in sales review meetings.
        '400':
          description: >
            Bad Request. Possible causes:


            - Missing required fields (`modelId`, `name`, `facetFilters`,
            `refreshInterval`, `filterConfig`, `filterOrder`,
            `queryPresentations`)

            - Invalid field values (`name` too long, `refreshInterval` less than
            `60`)

            - Empty `queryPresentations` array (at least one required)

            - Document has no dashboard (workbook-only document)

            - Analysis documents (workbooks or documents without a dashboard)
            are not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User has insufficient permissions to update document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Conflict. Draft already exists - set clearExistingDraft to true to
            discard it and proceed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{documentId}/access-list:
    get:
      tags:
        - Document permissions
      summary: List all users and groups with document access
      description: >
        Returns all users and groups with access to a document in a single
        paginated call. 


        The response includes a list of `principal` objects, where each entry
        represents a distinct access grant with its own role and settings. A
        `principal` may appear twice in the response if they have both `direct`
        access and `folder`-based access to the same document. 
      security:
        - bearerAuth: []
      operationId: listDocumentAccessList
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >
            The document identifier. To retrieve the ID, navigate to **File >
            Document settings** in the document and then click **Settings**. The
            **Identifier** field contains the document ID.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of results per page (1-100).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Pagination cursor from a previous response's `pageInfo.nextCursor`.
        - name: sortField
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
              - email
              - role
            default: name
          description: Field to sort results by.
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: Sort order.
        - name: accessSource
          in: query
          required: false
          schema:
            type: string
            enum:
              - direct
              - folder
          description: |
            Filter by how access was granted:
            - `direct` — Only principals with explicit document permissions
            - `folder` — Only principals with inherited folder permissions
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - user
              - userGroup
          description: |
            Filter by principal type:
            - `user` — Only individual users
            - `userGroup` — Only user groups
      responses:
        '200':
          description: Successfully retrieved access list
          content:
            application/json:
              schema:
                type: object
                properties:
                  principals:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentAccessPrincipal'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
              example:
                principals:
                  - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    name: Jane Smith
                    email: jane@example.com
                    type: user
                    role: EDITOR
                    accessBoost: false
                    accessSource: direct
                    isOwner: false
                  - id: b2c3d4e5-f6a7-8901-bcde-f23456789012
                    name: John Doe
                    email: john@example.com
                    type: user
                    role: VIEWER
                    accessBoost: false
                    accessSource: folder
                    isOwner: false
                    folderInfo:
                      id: c3d4e5f6-a7b8-9012-cdef-345678901234
                      name: Marketing Reports
                      path: /Shared/Marketing Reports
                  - id: d4e5f6a7-b8c9-0123-def0-456789012345
                    name: Data Analysts
                    type: userGroup
                    role: VIEWER
                    accessBoost: false
                    accessSource: direct
                pageInfo:
                  hasNextPage: true
                  nextCursor: eyJuYW1lIjoiSm9obiIsImlkIjoiMTIzIn0=
                  pageSize: 20
                  totalRecords: 47
        '400':
          description: |
            Bad Request. Possible causes:

            - Invalid `pageSize` value (must be 1-100)
            - Invalid `sortField` value
            - Invalid `sortDirection` value
            - Invalid `accessSource` value
            - Invalid `type` value
            - Invalid `cursor` value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPageSize:
                  summary: Invalid pageSize value
                  value:
                    detail: 'pageSize: Must be between 1 and 100'
                    status: 400
                invalidSortField:
                  summary: Invalid sortField value
                  value:
                    detail: 'sortField: Must be one of: name, email, role'
                    status: 400
        '403':
          description: >
            Forbidden. The user sending the API request must have **Manager**
            permissions for the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: User does not have permission to manage document permissions
                status: 403
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Document with identifier "<documentId>" not found
                status: 404
        '429':
          $ref: '#/components/responses/TooManyRequests'
