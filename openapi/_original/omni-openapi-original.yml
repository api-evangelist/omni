          description: >
            Document favorited successfully. No response body.


            This response is returned whether the document was newly favorited
            or already in favorites.
        '403':
          description: >
            Forbidden. Possible causes:


            - Personal Access Token attempted to act on behalf of another user.
            PATs cannot use the `userId` parameter.
          content:
