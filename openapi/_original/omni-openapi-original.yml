          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models:
    post:
      tags:
        - Models
      summary: Create model
      description: >
        Create a new model. The typical workflow for using this endpoint is:


        1. Create a schema model using this endpoint

        2. Use the [Refresh schema](/api/models/refresh-schema) endpoint to load
        the schema for the created model

        3. Create shared models based on the schema model
      security:
        - bearerAuth: []
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - connectionId
              properties:
                connectionId:
                  type: string
                  format: uuid
                  description: ID of the connection the model is based on.
                modelKind:
                  type: string
                  enum:
                    - SCHEMA
                    - SHARED
                    - SHARED_EXTENSION
                    - BRANCH
                  default: SCHEMA
                  description: >
                    Type of model.


                    - `SCHEMA` - Mirrors the database structure

                    - `SHARED` - Represents the universal, governed data model
                    that workbooks are based on

                    - `SHARED_EXTENSION` - Represents an extension to the
                    `SHARED` model. Can be used to dynamically extend the
                    `SHARED` model based on user attributes, or as a model that
                    workbooks are based on in a departmental use case.

                    - `BRANCH` - A model layer that is used to develop
                    modifications to the production shared model


                    For more information, see the [Modeling
                    documentation](/modeling).
                modelName:
                  type: string
                  description: Name of the model.
                baseModelId:
                  type: string
                  description: >
                    **Applicable to branch and extension models.** ID of the
                    base model.
                accessGrants:
                  type: array
                  default: []
                  description: >-
                    List of [access
                    grants](/modeling/develop/data-access-control) for the
                    model.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name of the access grant.
                      accessBoostable:
                        type: boolean
                        description: If `true`, the access grant can be boosted.
                allowAsWorkbookBase:
                  type: boolean
                  default: false
                  description: >
                    **Only applicable to `SHARED_EXTENSION` models**. If `true`,
                    allows the model to be selected as a base model when
                    creating workbooks.
                useIsolatedBranches:
                  type: boolean
                  default: false
                  description: >
                    **Only applicable to `SHARED_EXTENSION` models**. If `true`,
                    branches are shown on the extension model page instead of
                    parent shared model.
      responses:
        '200':
          description: Model created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message if creation failed
                  message:
                    type: string
                    description: Additional message
                  model:
                    type: object
                    description: Details about the model
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: ID of the created model.
                      modelKind:
                        type: string
                        description: The type of model.
                      name:
                        type: string
                        description: The name of the model.
                  success:
                    type: boolean
                    description: Indicates if the operation succeeded
        '400':
          description: >
            Bad Request


            Possible error messages:


            - `Bad Request: Invalid parameter value`

            - `Bad Request: Schema model already exists for the connection`

            - `Bad Request: Schema model does not exist when creating a
            non-schema model`

            - `Bad Request: Shared model cannot be created when branch schema
            refresh is enabled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Forbidden

            Possible error messages:

            - `Forbidden`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - Models
      summary: List models
      description: Retrieves a paginated list of models with their metadata.
      security:
        - bearerAuth: []
      operationId: listModels
      parameters:
        - name: baseModelId
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter models by base model ID.
        - name: connectionId
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter models by connection ID.
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
          description: |
            If `true`, include deleted models.
        - name: modelId
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter models by a specific model ID.
        - name: modelKind
          in: query
          required: false
          schema:
            type: string
            enum:
              - SCHEMA
              - SHARED
              - SHARED_EXTENSION
              - WORKBOOK
              - BRANCH
              - QUERY
              - TOPIC
              - FIELD_PICKER_TOPIC
          description: |
            Filter by model kind.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter models by name.
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
          description: Specifies the number of records per page.
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            default: desc
            enum:
              - asc
              - desc
          description: |
            Sort direction.
        - name: sortField
          in: query
          required: false
          schema:
            type: string
            default: updatedAt
            enum:
              - name
              - modelKind
              - connectionId
              - baseModelId
              - createdAt
              - updatedAt
          description: |
            Field to sort by. 
        - name: include
          in: query
          schema:
            type: string
            enum:
              - activeBranches
          description: >
            Comma-separated list of additional fields to include in the
            response.


            - `activeBranches` - Include active branches for each model
      responses:
        '200':
          description: Paginated model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  records:
                    type: array
                    description: List of model records.
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Model'
                        - type: object
                          properties:
                            branches:
                              type: array
                              description: >-
                                List of branch models. Only included when
                                `include=activeBranches`.
                              items:
                                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}:
    patch:
      tags:
        - Models
      summary: Rename model
      description: >
        <Warning>
          Workbook models and query models cannot be renamed via this endpoint.
        </Warning>


        Renames a model by updating its name. This endpoint allows you to
        programmatically rename models without using the UI, which is
        particularly useful for bulk operations on shared extension models
        created via `POST /api/v1/models`.


        The new name must be unique among active models with the same
        `modelKind` and `baseModelId`.


        **Branch-specific constraints:**


        - Name must match git-compatible regex: `[\w\-/]+`

        - No git ref path conflicts (e.g., cannot rename to `team` if
        `team/project` exists)

        - Cannot rename branches with an open pull request (when
        `pullRequestUrl` is set) — renaming would desync Omni from the git
        remote
      security:
        - bearerAuth: []
      operationId: renameModel
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the model to rename.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The new name for the model.
                  example: customer_metrics_v2
      responses:
        '200':
          description: Model renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          description: >
            Bad Request


            Possible error messages:


            - `Bad Request: Cannot rename models of kind WORKBOOK`

            - `Bad Request: Cannot rename models of kind QUERY`

            - `Bad Request: Model name must be unique`

            - `Bad Request: Branch name must match git-compatible regex
            [\w\-/]+`

            - `Bad Request: Branch name would create git ref path conflict`

            - `Bad Request: Cannot rename branch with open pull request`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Model not found`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/ai-agent-actions:
    get:
      tags:
        - Models
      summary: Get model AI agent actions
      description: >
        Return AI agent actions configured for a model — a unified list of
        sample queries and skills suitable for surfacing as suggested prompts in
        AI interfaces.


        Sample queries come from both `model.sample_queries` and each topic's
        `sample_queries`. Skills come from `model.skills` and each topic's
        `skills`, deduped by ID with topic skills overriding model skills.


        When no actions are configured at the model or topic level, `records`
        returns an empty array.
      security:
        - bearerAuth: []
      operationId: getModelAiAgentActions
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the model.
      responses:
        '200':
          description: AI agent actions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates the request was successful
                  records:
                    type: array
                    description: >-
                      List of AI agent actions (sample queries and skills)
                      configured for the model.
                    items:
                      type: object
                      required:
                        - type
                        - id
                        - label
                        - description
                        - prompt
                      properties:
                        type:
                          type: string
                          enum:
                            - sample_query
                            - skill
                          description: The type of action.
                        id:
                          type: string
                          description: Unique identifier for the action.
                        label:
                          type: string
                          description: Display label for the action.
                        description:
                          type: string
                          description: Description of what the action does.
                        prompt:
                          type: string
                          description: >-
                            The prompt text to submit to the [Create AI job
                            endpoint](/api/ai/create-ai-job). For skills, this
                            is pre-formatted with the skill envelope.
              example:
                success: true
                records:
                  - type: sample_query
                    id: revenue_by_region
                    label: Revenue by region
                    description: Show total revenue grouped by region
                    prompt: Show me revenue by region
                  - type: skill
                    id: analyze_trends
                    label: Analyze trends
                    description: Analyze trends in the data
                    prompt: |-
                      Skill: analyze_trends
                      Analyze trends in revenue over time
        '400':
          description: |
            Bad Request

            Possible error messages:

            - `modelId: Invalid UUID`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Forbidden

            Possible error messages:

            - `Permission denied`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Model with id <modelId> does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/suggestions/generate:
    post:
      tags:
        - AI Model Suggestions
      summary: Generate model suggestions
      description: >
        <Note>
          This endpoint requires **Organization Admin** permissions.
        </Note>


        Trigger an AI suggestion generation run for the shared model and enqueue
        the async job. Poll the [Get status for a generation run
        endpoint](/api/ai-model-suggestions/get-status-for-a-generation-run) for
        status.


        A model can have one active run at a time and a cooldown period is
        enforced after a successful run. See the `Retry-After` header in the
        response for more information.
      security:
        - bearerAuth: []
      operationId: modelSuggestionsGenerate
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the shared model the suggestions belong to
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        '202':
          description: Generation run enqueued
          content:
            application/json:
              schema:
                type: object
                required:
                  - runId
                  - status
                properties:
                  runId:
                    type: string
                    format: uuid
                    description: >
                      The ID of the created generation run. Poll the [Get status
                      for a generation run
                      endpoint](/api/ai-model-suggestions/get-status-for-a-generation-run)
                      for status.
                  status:
                    type: string
                    enum:
                      - queued
                    description: The status of the run. Generation runs asynchronously.
              example:
                runId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                status: queued
        '400':
          description: |
            Bad Request

            Possible error messages:

            - `modelId: Invalid UUID` - The model ID is not a valid UUID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError400'
        '401':
          description: Authentication required
        '403':
          description: |
            Forbidden

            Possible error messages:

            - `Permission denied` - User is not an Organization Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError403'
        '404':
          description: Model not found in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError404'
        '405':
          description: Method not allowed
        '409':
          description: A generation run is already active for this model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError409'
              example:
                detail: A generation run is already active for this model
                status: 409
        '429':
          description: >-
            A run completed recently; retry after the cooldown (see the
            `Retry-After` header)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Number of seconds to wait before retrying
          content:
            application/json:
              schema:
                type: object
                required:
                  - runId
                  - status
                properties:
                  runId:
                    type: string
                    format: uuid
                    description: >
                      The ID of the created generation run. Poll the [Get status
                      for a generation run
                      endpoint](/api/ai-model-suggestions/get-status-for-a-generation-run)
                      for status.
                  status:
                    type: string
                    enum:
                      - queued
                    description: The status of the run. Generation runs asynchronously.
              example:
                detail: >-
                  A run completed recently. Please wait before triggering
                  another run.
                lastCompletedAt: '2026-07-20T10:30:00.000Z'
                retryAfterSeconds: 300
                status: 429
        '500':
          description: Failed to enqueue the generation job
  /v1/models/{modelId}/suggestions/schedule:
    put:
      tags:
        - AI Model Suggestions
      summary: Enable model AI suggestions schedule
      description: >
        <Note>
          This endpoint requires **Organization Admin** permissions.
        </Note>


        Enable the daily generation schedule for AI model suggestions on a
        shared model. Suggestions are generated daily at midnight in the
        specified timezone.


        This operation is idempotent: calling it multiple times returns the
        persisted schedule.
      security:
        - bearerAuth: []
      operationId: modelSuggestionsScheduleEnable
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the model.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  description: >
                    IANA timezone string (e.g., `America/New_York`,
                    `Europe/London`, `UTC`). Determines when the daily
                    suggestion generation runs. Defaults to `UTC` if not
                    provided.
              additionalProperties: false
            examples:
              withTimezone:
                summary: Enable with specific timezone
                value:
                  timezone: America/New_York
              defaultTimezone:
                summary: Enable with default UTC timezone
                value: {}
      responses:
        '200':
          description: >-
            Schedule enabled successfully. Returns the current state of the
            schedule, or the same state if already enabled.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - sharedModelId
                  - status
                  - timezone
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier for the schedule.
                  sharedModelId:
                    type: string
                    format: uuid
                    description: The shared model the schedule generates suggestions for.
                  status:
                    type: string
                    enum:
                      - enabled
                  timezone:
                    type: string
                    description: IANA timezone the schedule runs in.
                    example: America/New_York
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                sharedModelId: f1e2d3c4-b5a6-7890-abcd-ef9876543210
                status: enabled
                timezone: America/New_York
        '400':
          description: >
            Bad Request


            Possible error messages:


            - `modelId: Invalid UUID` - The model ID is not a valid UUID format

            - `timezone: Invalid timezone` - The provided timezone is not a
            valid IANA timezone format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError400'
        '403':
          description: >
            Forbidden


            Possible error messages:


            - `Permission denied` - User is not an organization admin

            - `AI is not enabled for this organization` - Organization does not
            have AI features enabled

            - `Model must be shared` - The model is not a shared model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError403'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Model with id <modelId> does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError404'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - AI Model Suggestions
      summary: Disable model AI suggestions schedule
      description: >
        <Note>
          This endpoint requires **Organization Admin** permissions.
        </Note>


        Disable the daily generation schedule for AI model suggestions on a
        shared model.


        This operation is idempotent: calling it multiple times returns success
        even if the schedule is already disabled.
      security:
        - bearerAuth: []
      operationId: modelSuggestionsScheduleDisable
      parameters:
        - schema:
            type: string
            format: uuid
            example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          required: true
          description: UUID of the shared model the suggestions belong to
          name: modelId
          in: path
      responses:
        '200':
          description: >-
            Schedule disabled successfully. Returns confirmation even if the
            schedule was already disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: AI suggestions schedule disabled
        '400':
          description: |
            Bad Request

            Possible error messages:

            - `modelId: Invalid UUID` - The model ID is not a valid UUID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError400'
        '403':
          description: >
            Forbidden


            Possible error messages:


            - `Permission denied` - User is not an Organization Admin

            - `AI is not enabled for this organization` - Organization does not
            have AI features enabled

            - `Model must be shared` - The model is not a shared model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError403'
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Model with id <modelId> does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError404'
        '405':
          description: Method not allowed
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/branch/{branchName}:
    delete:
      tags:
        - Models
      summary: Delete branch
