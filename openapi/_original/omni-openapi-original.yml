          format: uuid
          description: Unique identifier of the dbt environment
        name:
          type: string
          description: The name of the dbt environment
        isDefaultEnvironment:
          type: boolean
          description: Whether this is the default environment
        isDeferralEnabled:
          type: boolean
          description: >
            Whether deferral is enabled for this environment. Ignored (forced to
            `false`) for the default (production) environment.
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: The user ID of the owner of the dbt environment, or null
        targetDatabase:
          type: string
          nullable: true
          description: Target database override
        targetName:
          type: string
          nullable: true
          description: Target name override
        targetRole:
          type: string
          nullable: true
          description: Target role override
        targetSchema:
          type: string
          description: Target schema for the environment
        variables:
          type: array
          description: Environment variables
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Variable identifier
              name:
                type: string
                description: Variable name
              value:
                type: string
                nullable: true
                description: >
                  Variable value. If `isSecret: true`, this value will be `null`
                  in responses to protect sensitive information.
              isSecret:
                type: boolean
                description: |
                  Whether the variable value is secret.
    Error:
