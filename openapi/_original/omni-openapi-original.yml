    get:
      tags:
        - Documents
      summary: List documents
      description: List documents with pagination and filtering
      security:
        - bearerAuth: []
      operationId: listDocuments
      parameters:
        - name: include
          in: query
          schema:
            type: string
          description: >
            Comma-separated list of additional fields to include in the
            response:

            - `_count` - Adds favorite and view count metrics

            - `labels` - Includes associated document labels

            - `includeDeleted` - Include deleted documents

            - `onlyFavorites` - **Must be used with `userId`.** Include only
            documents that the specified user has favorited.

            - `onlySharedWithMe` - Returns only documents explicitly shared with
            the specified user via documents permissions. Excludes documents
            owned by the user. Cannot be combined with `ownerId` or `path`.

               Additionally, depending on the type of API key being used:

               - **Organization API keys** require the `userId` parameter
               - **Personal Access Tokens** automatically infer the `userId` from the token
        - name: labels
          in: query
          schema:
            type: string
          description: >
            Comma-separated list of labels to filter results. For example:
            `finance,marketing`
        - name: folderId
          in: query
          schema:
            type: string
            format: uuid
          description: >-
            ID of the folder to filter results. Returns only documents within
            the specified folder.
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of records per page
        - name: sortField
          in: query
          schema:
            type: string
            enum:
              - favorites
              - name
              - updatedAt
              - visits
            default: name
          description: |
            Field to sort by:
            - `favorites` - Sort by the number of favorites
            - `name` - Sort by document name
            - `updatedAt` - Sort by last update time
            - `visits` - Sort by view count
        - name: sortDirection
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sort direction (`asc` for ascending, `desc` for descending)
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            Cursor for pagination. Used with `sortField`/`sortDirection` for
            relative positioning.
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
          description: >
            The ID of a standard or embed user to filter results, returning only
            documents the specified user can view based on their permissions.


            If `include=onlyFavorites` is specified:


            - **And using an Organization API key**, this parameter is
            **required**

            - **And using a Personal Access Token**, the `userId` will be
            automatically inferred from the token
        - name: creatorId
          in: query
          schema:
            type: string
            format: uuid
          description: >-
            ID of the user who created the document(s), returning only documents
            that the specified user created.
      responses:
        '200':
          description: Paginated document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsListResponse'
        '400':
          description: >
            Bad Request


            Possible error messages:

            - `pageSize: Page size must be at least 1`

            - `pageSize: Page size cannot exceed 100`

            - `sortField: Invalid enum value. Expected 'favorites' | 'name' |
            'updatedAt' | 'visits', received '<invalidField>'`

            - `creatorId: Invalid uuid`

            - `userId: Invalid uuid`

            - `formErrors: Unrecognized key(s) in object: '<unknownParameter>'`

            - `onlySharedWithMe requires userId` - When using
            `include=onlySharedWithMe` without providing a `userId` parameter

            - `onlySharedWithMe cannot be combined with onlyFavorites` - When
            using both `include=onlySharedWithMe` and `include=onlyFavorites`
            together

            - `onlySharedWithMe cannot be combined with folderId` - When using
            `include=onlySharedWithMe` with a `folderId` parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Not Found


            Possible error messages:

            - `User with id <uuid> does not exist`


            **Note**: An invalid UUID format will result in a 400 error. This
            404 error occurs when the provided ID is a valid UUID format but the
            user cannot be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{documentId}/move:
    put:
      tags:
        - Documents
      summary: Move document
      description: |
        Move document to new folder or change scope.
      security:
        - bearerAuth: []
      operationId: moveDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >
            The ID of the document to move. To retrieve the ID, navigate to
            **File > Document settings** in the document and then click
            **Settings**. The **Identifier** field contains the document ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - folderPath
              properties:
                folderPath:
                  oneOf:
                    - type: string
                    - type: 'null'
                  description: >-
                    The path of the destination folder. Use `null` to move the
                    document to the root level (no folder).
                scope:
                  type: string
                  enum:
                    - organization
                    - restricted
                  description: >
                    Optional sharing scope for the document:

                    - `organization` - Organization-wide access

                    - `restricted` - Limited access


                    If not provided, the scope will be computed based on the
                    document or the destination folder.


                    **Note**: When providing a scope, it must match the
                    destination folder's scope.
      responses:
        '200':
          description: Document moved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: |
            Bad Request

            Possible error messages:
            - `Scope "<scope>" and folder scope "<folderScope>" do not match`
            - `Invalid method`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            Forbidden


            Possible error messages/causes:


            - `User-scoped API keys cannot act on behalf of other users`

            - Operations targeting personal/restricted scope require the user's
            **Personal content access** setting (`omni_allows_personal_content`
            system attribute) to be enabled for the user. If not enabled, the
            API will respond with `403 Forbidden`.
        '404':
          description: |
            Not Found

            Possible error messages:
            - `Document with identifier "<documentId>" not found`
            - `Folder with path <path> does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{documentId}/duplicate:
    post:
      tags:
        - Documents
      summary: Duplicate published document
      x-mint:
        content: |
          <Warning>
            Only published documents can be duplicated. Attempting to duplicate a draft document will return a 404 error.
          </Warning>

          Duplicate a published document.
      security:
        - bearerAuth: []
      operationId: duplicateDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: Document identifier
        - name: userId
          in: query
          schema:
            type: string
          description: >
            **Requires an Organization API key**. Optional user ID that
            attributes the action to the specified user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: The name for the duplicated document
                folderPath:
                  oneOf:
                    - type: string
                    - type: 'null'
                  description: >-
                    Path to the destination folder. If not provided, the
                    document will be duplicated to the root.
                scope:
                  type: string
                  enum:
                    - organization
                    - restricted
                  description: >
                    The visibility scope for the duplicated document.


                    If not provided, inherits from the destination folder or
                    defaults to `restricted`.
            example:
              name: My Dashboard Copy
              folderPath: /reports/2024/q4
              scope: organization
      responses:
        '201':
          description: Document duplicated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboardId:
                    type: string
                    description: >-
                      The dashboard ID, if the duplicated document has a
                      dashboard
                  identifier:
                    type: string
                    description: Unique identifier for the newly created document
                  name:
                    type: string
                    description: The name of the duplicated document
                  workbookId:
                    type: string
                    description: The workbook ID of the duplicated document
              example:
                dashboardId: abc123-dash-id
                identifier: xyz789-new-identifier
                name: My Dashboard Copy
                workbookId: def456-workbook-id
        '400':
          description: |
            Bad Request. Possible error messages:

            - `name: Name cannot be empty`
            - `name: Name must be 255 characters or less`
            - `Scope "organization" and folder scope "restricted" do not match`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            Insufficient permissions. Possible error messages/causes:


            - `User does not have access to create content on the specified
            connection`

            - `User-scoped API keys can only be used to act on behalf of the
            authenticated user.`

            - `Document duplication is disabled`. The document's duplication
            permission is disabled.

            - Operations targeting personal/restricted scope require the user's
            **Personal content access** setting (`omni_allows_personal_content`
            system attribute) to be enabled for the user. If not enabled, the
            API will respond with `403 Forbidden`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Not Found. Possible error messages:


            - `Document with identifier "<documentId>" not found`

            - `Published document with id "<documentId>" does not exist`. This
            will surface when attempting to duplicate a draft.

            - `Folder with path "<folderPath>" does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{identifier}/upgrade:
    post:
      tags:
        - Documents
      summary: Upgrade dashboard layout
      description: >
        Upgrade a document to the advanced dashboard layout — the same action
        available in the UI under **File > Upgrade layout**.


        <Note>
          This operation is idempotent. If the document already uses the advanced layout, the request is a no-op and returns `upgraded: false`.
        </Note>


        For published documents the upgrade runs through a draft-and-publish
        workflow automatically. If a draft already exists, the request returns
        `409` unless `clearExistingDraft` is set to `true`, which discards the
        existing draft before upgrading.
      operationId: documentsUpgradeLayout
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
          description: Document identifier (either document ID or identifier slug)
          example: abc123
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentsUpgradeLayoutBody'
            example:
              clearExistingDraft: true
      responses:
        '200':
          description: >-
            Layout upgraded, or no-op if the document already had advanced
            layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsUpgradeLayoutResponse'
              example:
                identifier: abc123
                upgraded: true
        '400':
          description: |
            Bad Request

            - The document does not have a dashboard to upgrade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError400'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError401'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError403'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError404'
        '409':
          description: >-
            A draft already exists for the published document; set
            `clearExistingDraft` to `true` to override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError409'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{documentId}/transfer-ownership:
    put:
      tags:
        - Documents
      summary: Transfer document ownership
      description: >
        Transfer ownership of a document to another user in the organization.


        To successfully transfer a document: 


        - The user performing the transfer must have `MANAGER` permissions or
        higher on the document

        - The new owner must be a member of the organization AND have explicit
        access to the document


        Upon success, the following occurs: 


        - Ownership of the document is updated to the new owner

        - The previous owner is granted `MANAGER` permissions on the document

        - Explicit permits for the new owner are revoked, as they now have owner
        access

        - Content search index is updated


        **Note:** Transferring to the current owner is a no-op and returns
        success.
      security:
        - bearerAuth: []
      operationId: transferDocumentOwnership
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >
            The ID of the document to transfer. To retrieve the ID, navigate to
            **File > Document settings** in the document and then click
            **Settings**. The **Identifier** field contains the document ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  description: >-
                    The membership ID of the user to transfer ownership to. This
                    must be a valid organization member who has explicit
                    permission on the document.
            example:
              userId: 9e8719d9-276a-4964-9395-a493189a247c
      responses:
        '200':
          description: >
            Document ownership transferred successfully.


            **Note:** This response is also returned when transferring to the
            current owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
        '400':
          description: |
            Bad Request

            Possible error messages:
            - `Invalid JSON`
            - `userId is required`
            - `New owner must have explicit document permission`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidJson:
                  summary: Invalid JSON body
                  value:
                    error: Invalid JSON
                missingUserId:
                  summary: Missing userId field
                  value:
                    error: userId is required
                noPermission:
                  summary: New owner lacks document permission
                  value:
                    error: New owner must have explicit document permission
        '403':
          description: >
            Forbidden


            Possible error messages:


            - `Insufficient permissions` - Acting user does not have `MANAGER`
            or higher permissions on the document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Insufficient permissions
        '404':
          description: |
            Not Found

            Possible error messages:

            - `Document with identifier "<documentId>" not found`
            - `User not found`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                documentNotFound:
                  summary: Document not found
                  value:
                    error: Document with identifier "doc-123" not found
                userNotFound:
                  summary: User not found
                  value:
                    error: User not found
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{documentId}/draft:
    post:
      tags:
        - Documents
      summary: Create draft
      deprecated: true
      description: >
        <Warning>
          **Deprecated** — Removal scheduled for **July 31, 2026**. Use the [Documents v2 API](/api/documents-v2/create-document) instead.
        </Warning>


        <Note>
          This endpoint requires **Editor** permissions or higher on the specified document.
        </Note>


        Creates a [draft](/content/develop/drafts) of the specified document.
        Drafts are isolated copies of a document - including its workbook and
        dashboard - that can be modified without impacting the published
        version.


        To create a draft on a [branch](/content/develop/branch-mode), include a
        `branchId` in the request body. Each branch can have one draft per
        document.


        If a draft already exists for the document (or branch, if specified),
        the existing draft is returned instead of creating a new one.
      security:
        - bearerAuth: []
      operationId: createDraft
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >
            The ID of the document to create a draft for. To retrieve the ID,
            navigate to **File > Document settings** in the document and then
            click **Settings**. The **Identifier** field contains the document
            ID.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branchId:
                  type: string
                  format: uuid
                  description: >-
                    The UUID of the branch to create the draft on. Required when
                    creating a draft on a branch. To retrieve branch IDs, use
                    the [List models](/api/models/list-models) endpoint with
                    `modelKind=BRANCH`.
      responses:
        '200':
          description: Draft created successfully (or existing draft returned)
          headers:
            Deprecation:
              description: Indicates that this endpoint is deprecated
              schema:
                type: string
                example: 'true'
            Sunset:
              description: The date this endpoint will be removed (RFC 9110)
              schema:
                type: string
                format: date
                example: '2026-07-31'
            Link:
              description: Link to the replacement API (RFC 8288)
              schema:
                type: string
                example: </api/documents-v2/create-document>; rel="successor-version"
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    description: >-
                      Identifier of the new draft. If a draft already exists for
                      the document or branch specified, this will be the
                      identifier of the existing draft.
                    example: 93874a87
        '400':
          description: |
            Bad request

            Possible error messages:
            - Document is not eligible for publishing workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Forbidden

            Possible error messages:
            - Permission denied - EDITOR role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found

            Possible error messages:
            - `Document with identifier <documentId> not found`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Documents
      summary: Archive draft
      description: >
        Archives the current draft of the specified document. Archived drafts
        will be placed in the in the [**Archived** section of the **Drafts**
        drawer](/content/develop/drafts#archiving-drafts) in the document's
        workbook and retained for 30 days.


        If a branch is specified, the current draft on the branch is archived.
      security:
        - bearerAuth: []
      operationId: archiveDraft
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >
            The ID of the document to archive the draft from. To retrieve the
            ID, navigate to **File > Document settings** in the document and
            then click **Settings**. The **Identifier** field contains the
            document ID.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branchId:
                  type: string
                  format: uuid
                  description: >-
                    The UUID of the branch the draft is attached to. To retrieve
                    branch IDs, use the [List models](/api/models/list-models)
                    endpoint with `modelKind=BRANCH`.
      responses:
        '200':
          description: Draft archived successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Draft deleted successfully
        '404':
          description: |
            Not Found

            Possible error messages:
            - `Document with identifier <documentId> not found`
            - `Draft with id <documentId> does not exist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/documents/{identifier}/drafts:
    get:
      tags:
        - Documents
      summary: List document drafts
      description: >
        <Note>
          This endpoint requires **Viewer** permissions or higher on the specified document.
        </Note>


        List all drafts attached to a published document. A document in Omni can
        have up to one draft per branch plus one draft not attached to a branch.


        By default, returns active drafts only. Pass `?include=archived` to
        include soft-deleted drafts retained for approximately 7 days.
      security:
        - bearerAuth: []
      operationId: listDocumentDrafts
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
          description: >
            The identifier of the published document. To retrieve the ID,
            navigate to **File > Document settings** in the document and then
            click **Settings**. The **Identifier** field contains the document
            ID.
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum:
              - archived
          description: >
            Pass `archived` to include soft-deleted drafts in the response. By
            default, only active drafts are returned.
          example: archived
      responses:
        '200':
          description: >
            List of drafts retrieved successfully. Results are sorted in
            descending order using the draft's `updatedAt`.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    identifier:
                      type: string
                      description: The identifier of the draft.
                      example: d56b7f56
                    publishedIdentifier:
                      type: string
                      description: >-
                        The identifier of the published document this draft is
                        attached to.
                      example: ecd01fe5
                    workbookModelId:
                      type: string
                      format: uuid
                      description: The UUID of the workbook model.
                      example: d61034e2-05fe-4268-a3a7-d4cdb8d650e9
                    branch:
                      type: object
                      nullable: true
                      description: >-
                        The branch this draft is attached to, or `null` for
                        draft not attached to a branch. A document can only have
                        one draft not attached to a branch.
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The UUID of the branch.
                        name:
                          type: string
                          nullable: true
                          description: >-
                            The name of the branch. Can be `null` if the branch
                            is unnamed.
                      example:
                        id: a9bc51d2-1234-5678-9abc-def012345678
                        name: governance/relabel-age-average
                    status:
                      type: string
                      enum:
                        - active
                        - archived
                      description: The status of the draft.
                      example: active
                    draftOutOfDate:
                      type: boolean
                      description: >-
                        Indicates whether the draft is [out of
                        date](/content/develop/branch-mode#working-with-out-of-date-drafts)
                        compared to the published document.
                      example: false
                    createdAt:
                      type: string
                      format: date-time
                      description: Timestamp when the draft was created.
                      example: '2026-05-06T13:44:00.000Z'
                    updatedAt:
                      type: string
                      format: date-time
                      description: Timestamp when the draft was last updated.
                      example: '2026-05-06T13:44:26.000Z'
                    createdBy:
                      type: object
                      description: User who created the draft.
                      properties:
                        name:
                          type: string
                          description: Display name of the user who created the draft.
                      example:
                        name: Blob Ross
                    lastEditedBy:
                      type: object
                      description: User who last edited the draft.
                      properties:
                        name:
                          type: string
                          description: Display name of the user who last edited the draft.
                      example:
                        name: Blob Ross
              example:
                - identifier: d56b7f56
                  publishedIdentifier: ecd01fe5
                  workbookModelId: d61034e2-05fe-4268-a3a7-d4cdb8d650e9
                  branch:
                    id: a9bc51d2-1234-5678-9abc-def012345678
                    name: governance/relabel-age-average
                  status: active
                  draftOutOfDate: false
                  createdAt: '2026-05-06T13:44:00.000Z'
                  updatedAt: '2026-05-06T13:44:26.000Z'
                  createdBy:
                    name: Blob Ross
                  lastEditedBy:
                    name: Blob Ross
        '400':
          description: |
            Bad Request

            Possible error messages:
            - `Invalid include parameter value`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >
            Forbidden


            Possible error messages:

            - `You do not have permission to view this document.` -
            Authenticating user must have **Viewer** permissions or higher on
            the document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Not Found


            Possible error messages:

            - `Document with identifier <identifier> not found`

            - `Published document with id <identifier> does not exist` -
            Document exists but has not been published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
