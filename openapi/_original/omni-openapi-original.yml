                                The type of role assignment:


                                - `User Role` - Direct role assignment to the
                                user

                                - `Group Role` - Role inherited from a user
                                group

                                - `Connection Base Role` - Default role from the
                                connection
                            miniUuid:
                              type: string
                              description: >-
                                The short ID of the user group. Only present for
                                `Group Role` type.
                            name:
                              type: string
                              description: >-
                                The name of the user group. Only present for
                                `Group Role` type.
                            depth:
                              type: integer
                              description: >-
                                The depth of group nesting. Only present for
                                `Group Role` type.
              example:
                membershipId: 9633bd79-7bdf-4773-8952-8fdd4098e51c
                results:
                  - baseRole: MODELER
                    from:
                      type: User Role
                    priority: 350
                    resolved: true
                    roleName: MODELER
                    connectionId: 8a464dc9-1f0e-4a9e-86fa-e1e6d970157c
                    modelId: 5fb90312-67b1-4cca-823a-9a341d549320
                  - baseRole: QUERIER
                    from:
                      depth: 0
                      miniUuid: PgjffoEu
                      name: Super Group
                      type: Group Role
                    priority: 250
                    resolved: false
                    roleName: QUERIER
                    connectionId: 8a464dc9-1f0e-4a9e-86fa-e1e6d970157c
                    modelId: 5fb90312-67b1-4cca-823a-9a341d549320
                  - baseRole: VIEWER
                    from:
                      type: Connection Base Role
                    priority: 50
                    resolved: false
                    roleName: VIEWER
                    connectionId: 8a464dc9-1f0e-4a9e-86fa-e1e6d970157c
                    modelId: 5fb90312-67b1-4cca-823a-9a341d549320
        '404':
          description: User not found in organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: User not found in organization
                status: 404
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/documents:
    post:
      tags:
        - Documents v2
      summary: Create document
      description: >
        Create a brand-new document and publish it live in a single call.
        Accepts creation metadata (`modelId`, `name`, and optional `identifier`
        / `description` / `folderId`) plus the same content slice as the draft
        patch body — `queryPresentations`, `controls`, `settings`, and
        `containers`.


        Tiles are addressed by their record key in `queryPresentations.data`
        (e.g. `"1"`, `"2"`); the server owns internal tile identity, so you
        never send `miniUuid`. A new document starts with a single empty seed
        tile at key `"1"` — write to `"1"` (or send it as `null`) to replace the
        seed.


        Because this is the first publish of brand-new content, it is not
        subject to the organization's `requirePullRequestToPublish` policy
        (which gates edits to existing content).
      x-mint:
        content: >
          ## Content sections


          - **`queryPresentations`** — Tabs/tiles keyed by record key. `data` is
          shallow-merged by key; `order` (when present) replaces the tab order.

          - **`controls`** — Dashboard filters/controls keyed by control ID.
          `data` is shallow-merged by key (`data.{id}: null` deletes a control);
          `order` (when present) replaces the control order.

          - **`settings`** — Dashboard settings, shallow-merged per key:
          `crossfilterEnabled`, `customText` (`queryError` / `queryNoResults`),
          `facetFilters`, `refreshInterval`, `runQueriesOn`.

          - **`containers`** — The dashboard layout. When present it fully
          replaces the existing layout (grid / stack / page / reference
          containers, recursively nested).


          ## Migrating from v1


          The v1 one-shot [Update dashboard
          document](/api/documents/update-dashboard-document)) maps to the v2
          **Create > Patch draft > Publish** workflow. For a brand-new document,
          a single request to this endpoint is enough. To edit an existing
          document, use [Create draft and patch document
          (v2)](/api/documents-v2/create-draft-and-patch-document) then [Publish
          draft (v2)](/api/documents-v2/publish-draft).


          | v1 `PUT` field | v2 location |

          |----------------|-------------|

          | `modelId` | `modelId` (returned on read; accepted but immutable on
          patch) |

          | `name` / `description` | `name` / `description` |

          | `facetFilters` (top-level) | `settings.facetFilters` |

          | `refreshInterval` (top-level) | `settings.refreshInterval` |

          | `filterConfig` / `filterOrder` | `controls.data` / `controls.order`
          |

          | `documentMetadata` (presentation) | `settings.*` / `containers` |

          | `queryPresentations` (array) | `queryPresentations.data` (keyed) +
          `queryPresentations.order` |

          | `clearExistingDraft` | **Removed.** A pre-existing draft now returns
          `409`; patch that draft or publish/discard it instead. |


          There is no one-shot `PATCH` endpoint for full document updates that
          includes identifier changes. To rename a published document's
          identifier, use the [Rename document identifier
          endpoint](/api/documents-v2/rename-document-identifier).


          There is also no `narrative` field — AI summaries attach as
          `linked`-type query presentations. See [Create draft and patch
          document](/api/documents-v2/create-draft-and-patch-document#ai-summaries-via-linked-tiles)
          for more information.
      security:
        - bearerAuth: []
      operationId: documentsV2Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentsV2CreateBody'
            examples:
              minimal:
                summary: Create an empty document
                value:
                  modelId: b81e4679-1234-4abc-9def-0123456789ab
                  name: Q2 Revenue
              withContent:
                summary: Create a document with one tile and a custom identifier
                value:
                  modelId: b81e4679-1234-4abc-9def-0123456789ab
                  identifier: q2-revenue
                  name: Q2 Revenue
                  description: Quarterly revenue review
                  queryPresentations:
                    data:
                      '1':
                        type: query
                        name: Revenue by month
                        topicName: order_items
                        prefersChart: true
                        query:
                          fields:
                            - order_items.created_at[month]
                            - order_items.sale_price_sum
                  settings:
                    crossfilterEnabled: true
                    refreshInterval: 3600
      responses:
        '201':
          description: Document created and published successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsV2CreateResponse'
              example:
                identifier: q2-revenue
                name: Q2 Revenue
                description: Quarterly revenue review
        '400':
          description: >
            Invalid request body or schema validation error — for example an
            unknown top-level field, a length cap exceeded (`name must be 254
            characters or fewer`), the query-presentation cap exceeded (`A
            single patch may carry at most 48 query presentations.`), or the
            `identifier` is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions to create a document on this model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Base model or branch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v2/documents/{documentId}:
    get:
      tags:
        - Documents v2
      summary: Get document state
      description: >
        Read the document's published state. To read a draft's state, use [Get
        draft state](/api/documents-v2/get-draft-state) instead.


        The response can be used as-is as the request body in a call to the
        [Patch draft API](/api/documents-v2/patch-draft).


        Tiles in `queryPresentations.data` are keyed by a stable record key
        (e.g. `"1"`, `"2"`); the server uses that key to identify existing tiles
        on a later patch, so you never need to track any other identifier.
        Control IDs and container `instanceKey` / `referenceKey` values also
        round-trip unchanged.


        A workbook-only document (no dashboard layout yet) returns only the
        workbook-scoped fields (`name`, `description`, `queryPresentations`);
        the dashboard-scoped `containers`, `controls`, and `settings` are
        omitted until a layout exists.
      security:
        - bearerAuth: []
      operationId: documentsV2Get
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >-
            The document's URL slug (e.g. `abc123`) or its canonical workbook
            UUID.
        - name: pretty
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            Format response with 2-space indentation for readability. Accepts
            `true`, `1`, or no value (e.g., `?pretty`). Default is compact
            (single-line) JSON.
      responses:
        '200':
          description: Document state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsV2ReadResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions to read the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            The document cannot be read as a dashboard: a classic-layout
            dashboard (upgrade to the advanced layout first) or an app document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/documents/{documentId}/draft:
    patch:
      tags:
        - Documents v2
      summary: Create draft and patch document
      description: >
        Create a new draft on the published document and apply the patch in one
        call. There is no auto-publish — the response includes the new
        `draftIdentifier` for follow-up calls. Pass an optional `branchId` to
        attach the draft to a branch; omit it for a draft on the main
        (unpublished) workspace.
      x-mint:
        content: >
          ## Draft → publish workflow


          Editing an existing document is a three-step flow:


          1. **`PATCH /api/v2/documents/{documentId}/draft`** *(this endpoint)*
          — creates a new draft on the published document and applies your
          patch. Returns the new `draftIdentifier`.

          2. *(optional)* [**`PATCH
          /api/v2/documents/{documentId}/draft/{draftId}`**](/api/documents-v2/patch-draft)
          — apply further patches to that draft.

          3. [**`POST
          /api/v2/documents/{documentId}/draft/publish`**](/api/documents-v2/publish-draft)
          — publish the main draft live.


          A document may have only one main draft at a time. If one already
          exists, this endpoint returns `409` — patch the existing draft (step
          2) or publish/discard it first. This replaces v1's
          `clearExistingDraft` flag, which **does not exist** in v2.


          A `GET` response is a valid `PATCH` body — [read the current
          state](/api/documents-v2/get-document-state), edit it, and submit it
          back verbatim.


          ## Field constraints


          | Field | Limit | Error (`400`) |

          |-------|-------|---------------|

          | `name` (document) | 1–254 characters | `name cannot be empty` ·
          `name must be 254 characters or fewer` |

          | `summary` | 1–255 characters, optional | `summary cannot be empty` ·
          `summary must be 255 characters or fewer` |

          | `queryPresentations.data.{key}.name` | 1–144 characters | `name must
          be 144 characters or fewer` |

          | `queryPresentations.data.{key}.subTitle` | ≤ 250 characters |
          `subTitle must be 250 characters or fewer` |

          | `queryPresentations.data.{key}.description` | ≤ 500 characters |
          `description must be 500 characters or fewer` |

          | `queryPresentations.data` | ≤ 48 non-null entries per patch | `A
          single patch may carry at most 48 query presentations.` |


          `summary` is an audit-trail note describing the change (never returned
          by reads); when omitted the server generates one from the touched
          sections. Null `queryPresentations.data` entries (deletions) do not
          count toward the 48-entry cap.


          ## Addressing tiles (no `miniUuid`)


          Tiles are addressed by their record key in `queryPresentations.data`
          (e.g. `"2"`). The server owns internal tile identity, so you never
          send or manage `miniUuid`:


          - **New key** → a new tile is created.

          - **Existing key, identical content** (a verbatim round-trip of a
          `GET`) → treated as a **no-op** and dropped from the patch.

          - **Existing key, changed content** → the tile is updated (the server
          regenerates its internal identifier).

          - **`linked`-type tabs** always re-resolve — they are excluded from
          no-op detection.

          - Query presentations are immutable server-side: replace a tile by
          key, don't mutate it in place.


          `data` is **shallow-merged** by key — omitted keys are untouched;
          `data.{key}: null` deletes that tile. `order`, when present, replaces
          the tab order. `controls` and `settings` are likewise shallow-merged;
          `containers`, when present, fully replaces the layout.


          ## AI summaries via linked tiles


          There is no `narrative` field. To attach an AI-style summary that
          reuses another tile's query, add a `linked`-type query presentation
          whose `sourceQueryPresentationKey` points at the source tile's record
          key (a string such as `"2"` — **not** a positional index into
          `order`):


          ```json

          {
            "queryPresentations": {
              "data": {
                "3": {
                  "type": "linked",
                  "name": "Summary",
                  "sourceQueryPresentationKey": "2"
                }
              }
            }
          }

          ```
      security:
        - bearerAuth: []
      operationId: documentsV2PatchDraft
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >-
            The published document's URL slug (e.g. `abc123`) or its canonical
            workbook UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentsV2CreateDraftBody'
            examples:
              metadataOnly:
                summary: Rename the document and tweak a setting
                value:
                  name: Q2 Revenue (final)
                  summary: Rename and enable cross-filtering
                  settings:
                    crossfilterEnabled: true
              contentOnly:
                summary: Add a tile and delete another
                value:
                  queryPresentations:
                    data:
                      '3':
                        type: query
                        name: Orders by region
                        topicName: order_items
                        query:
                          fields:
                            - users.state
                            - order_items.count
                      '4': null
              linkedSummary:
                summary: Attach an AI summary linked to tile "2"
                value:
                  queryPresentations:
                    data:
                      '5':
                        type: linked
                        name: Summary
                        sourceQueryPresentationKey: '2'
              onBranch:
                summary: Create the draft on a branch
                value:
                  branchId: 8b1f0a2c-1234-4abc-9def-0123456789ab
                  name: Q2 Revenue (branch edit)
      responses:
        '200':
          description: Draft created and patch applied successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsV2PatchDraftResponse'
              example:
                identifier: q2-revenue
                draftIdentifier: q2-revenue-draft-7f3a
                name: Q2 Revenue (final)
                description: Quarterly revenue review
        '400':
          description: >
            Invalid request body or schema validation error — for example an
            unknown top-level field, a length cap exceeded, or the
            query-presentation cap exceeded (`A single patch may carry at most
            48 query presentations.`). Also returned when `modelId` doesn't
            match the document's current base model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions to update the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document or branch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: >
            The target is not a published document (drafts only attach to
            published documents) — for example a draft already exists for this
            document — or a concurrent request just created its layout; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            The document cannot satisfy the patch: a classic-layout dashboard
            (upgrade to the advanced layout first), an app document, or a
            workbook-only document patched without a `containers` payload (or
            with an empty one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/documents/{documentId}/draft/publish:
    post:
      tags:
        - Documents v2
      summary: Publish draft
      description: >
        Publish the document's current main (non-branch) draft, promoting it to
        the published version. No request body — the draft is consumed, so the
        response echoes the now-published document's metadata.


        Only the main draft is publishable here. A branch-attached draft is
        published by [merging its branch](/api/model-branches/merge-a-branch)
        (`POST /api/v1/models/{modelId}/branch/{branchName}/merge`), so a
        document with no main draft returns `404`.
      security:
        - bearerAuth: []
      operationId: documentsV2PublishDraft
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: >-
            The published document's URL slug (e.g. `abc123`) or its canonical
            workbook UUID.
      responses:
        '200':
          description: Draft published successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsV2PublishDraftResponse'
              example:
                identifier: q2-revenue
                name: Q2 Revenue (final)
                description: Quarterly revenue review
        '400':
          description: >
            The document requires a pull request to publish (detail: "Can't
            publish because this document can only be edited through a branch").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions to publish the draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            Document not found, or it has no main draft to publish (a
            branch-attached draft is published by merging its branch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: The target is not a published document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/documents/{documentId}/draft/{draftId}:
    get:
