      summary: List user attributes
      x-mint:
        content: >
          <Note>
            This endpoint requires Organization Admin permissions.
          </Note>


          Retrieves all [user attribute](/administration/users/attributes)
          definitions in your organization, including both custom-defined and
          system-defined attributes.


          User attributes enable row-level security filtering, personalize
          dashboard content, and configure per-user database credentials. This
          endpoint is useful for embed integrations to discover available
          attributes for setting values in SSO sessions.
      security:
        - bearerAuth: []
      operationId: listUserAttributes
      responses:
        '200':
          description: List of user attribute definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: >
                            The unique identifier of the user attribute. This
                            will be an empty string for system attributes.
                          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        name:
                          type: string
                          description: >-
                            The attribute reference name used in modeling and
                            API calls
                          example: region
                        label:
                          type: string
                          description: The human-readable display name for the attribute
                          example: Region
                        type:
                          type: string
                          enum:
                            - String
                            - Number
                          description: The data type of the attribute
                          example: String
                        multiple_values:
                          type: boolean
                          description: Whether the attribute accepts multiple values
                          example: false
                        default_value:
                          type: string
                          nullable: true
                          description: >-
                            The default value for the attribute if not specified
                            for a user
                          example: us-east
                        description:
                          type: string
                          nullable: true
                          description: Optional description of the attribute's purpose
                          example: User region for RLS
                        system:
                          type: boolean
                          description: >-
                            Whether this is a system-defined attribute (`true`)
                            or custom attribute (`false`)
                          example: false
              examples:
