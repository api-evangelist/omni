        verified:
          type: boolean
          description: Whether the label is verified/curated
          example: true
        homepage:
          type: boolean
          description: Whether the label appears on the organization homepage
          example: false
        usage_count:
          type: integer
          description: Total number of documents and folders using this label
          example: 12
        color:
          type: string
          maxLength: 9
          default: null
          description: |
            Hex color for the label
          example: '#0366d6'
        description:
          type: string
          maxLength: 500
          default: null
          description: Description of the label
          example: Documents based on dev schemas
    Model:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the model.
        baseModelId:
          type: string
          format: uuid
          nullable: true
          description: ID of the base model, if applicable.
        connectionId:
          type: string
          format: uuid
          nullable: true
          description: ID of the connection the model is based on.
        modelKind:
          type: string
          nullable: true
          description: The type of model.
        name:
          type: string
          nullable: true
          description: The name of the model.
        createdAt:
          type: string
          format: date-time
          description: The time the model was created.
        updatedAt:
          type: string
          format: date-time
          description: The time the model was last updated.
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: The time the model was deleted, if applicable.
    ModelGitConfig:
      type: object
      properties:
        authMethod:
          type: string
          enum:
            - ssh
            - https_token
          description: >-
            Authentication method. `ssh` for deploy key, `https_token` for
            deploy token/PAT.
          example: ssh
        cloneUrl:
          type: string
          description: Clone URL of the git repository (SSH or HTTPS)
          example: git@github.com:org/repo.git
        baseBranch:
          type: string
          description: The target branch for Omni pull requests.
          example: main
        branchPerPullRequest:
          type: boolean
          description: >-
            If `true`, all pull requests will create a branch in Omni, even
            those created outside of the tool.
          example: false
        gitFollower:
          type: boolean
          description: >-
            If `true`, the shared model is read-only and can only be updated by
            merging pull requests to the base branch.
          example: false
        gitServiceProvider:
          type: string
          enum:
            - github
            - gitlab
            - azure_devops
            - bitbucket
          description: |
            The git provider type.

            - `github` - GitHub
            - `gitlab` - GitLab
            - `azure_devops` - Azure DevOps
            - `bitbucket` - Bitbucket
          example: github
        modelPath:
          type: string
          nullable: true
          description: Path to model files in the repository.
          example: omni/blobs_r_us
        publicKey:
          type:
            - string
            - null
          description: >
            SSH public key for repository access (deploy key). Null for HTTPS
            token auth (`authMethod: https_token`).
          example: ssh-ed25519 AAAA...
        requirePullRequest:
          type: string
          enum:
            - always
            - users-only
            - never
          description: |
            Controls when pull requests are required for changes:

            - `always` - Required for all changes
            - `users-only` - Required only for user-initiated changes
            - `never` - Never required
          example: users-only
        sshUrl:
          type: string
          deprecated: true
          description: >
            **Deprecated. Use `cloneUrl` instead**. SSH URL of the git
            repository.
          example: git@github.com:org/repo.git
        webUrl:
          type: string
          nullable: true
          description: Custom web URL for the git repository, or null if not set.
          example: https://github.com/org/repo
        webhookSecret:
          type: string
          description: >-
            Webhook secret for signature verification. Only included if
            requested via `?include=webhookSecret`.
        webhookUrl:
          type: string
          description: Webhook URL to configure in your git provider.
          example: https://app.omni.co/api/webhooks/model/...
    ModelSuggestion:
      type: object
      required:
        - id
        - category
        - title
        - rationale
        - priority
        - proposedChanges
        - evidence
        - ignoreReason
        - ignoredAt
        - ignoredBy
        - aiModifiedAt
        - createdAt
        - updatedAt
      properties:
        id:
