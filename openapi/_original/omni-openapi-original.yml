                              description: If `true`, the user is the owner of the document
                            role:
                              type: string
                              description: The content role assigned to the user
                        folder:
                          type: object
                          description: Permissions inherited from a folder
                          properties:
                            accessBoost:
                              type: boolean
                              description: >-
                                If `true`, AccessBoost is enabled via folder
                                permissions
                            isOwner:
                              type: boolean
                              description: >-
                                If `true`, the user is the owner via folder
                                permissions
                            role:
                              type: string
                              description: >-
                                The content role inherited from folder
                                permissions
              example:
                permits:
                  - description: Organization
                    direct:
                      accessBoost: false
                      isOwner: false
                      role: VIEWER
                    id: df290ed4-b721-4efe-914b-95d30ce1c5f2
                    name: Organization
                    type: user
                  - description: Organization
                    folder:
                      accessBoost: false
                      isOwner: false
                      role: VIEWER
                    id: df290ed4-b721-4efe-914b-95d30ce1c5f2
                    name: Organization
                    type: user
        '400':
          description: |
            Bad Request. Possible causes:

            - Missing `userId` parameter
            - Invalid `userId` value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUserId:
                  summary: Missing userId parameter
                  value:
                    detail: 'userId: userId must be provided'
                    status: 400
                invalidUserId:
                  summary: Invalid userId value
                  value:
                    detail: 'userId: Invalid userId'
                    status: 400
        '403':
          description: >
            Forbidden. The user sending the API request must have **Manager**
            permissions for the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
