  /v1/models/{modelId}/branch/{branchName}/dbt:
    post:
      tags:
      - dbt
      summary: Set dbt environment on model branch
      description: 'Sets the active dbt environment on a model branch. This endpoint allows you to programmatically configure which dbt environment a branch should use, enabling CI/CD pipelines to automate dbt environment configuration before triggering schema refreshes.

        '
      security:
      - bearerAuth: []
      operationId: setModelBranchDbtEnvironment
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the model
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      - name: branchName
        in: path
        required: true
        schema:
          type: string
        description: The name of the branch to configure
        example: feature/new-models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dbt_environment_id
              properties:
                dbt_environment_id:
                  type: string
                  format: uuid
                  description: The ID of the dbt environment to set as active for the branch
                  example: b2c3d4e5-f6a7-8901-bcde-f12345678901
                dbt_git_branch:
                  type: string
                  description: Optional git branch name to associate with the dbt environment
                  example: feature/branch
            example:
              dbt_environment_id: b2c3d4e5-f6a7-8901-bcde-f12345678901
              dbt_git_branch: feature/branch
      responses:
        '200':
          description: dbt environment configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 'Bad Request


            Possible error messages:


            - `Bad Request: Invalid modelId format`

            - `Bad Request: Invalid dbt_environment_id format`

            - `dbt_environment_id is required`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Shared model or branch model does not exist`

            - `Branch model with id <branch-id> does not exist`

            - `dbt environment not found`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  schemas:
    DbtEnvironment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the dbt environment
        name:
          type: string
          description: The name of the dbt environment
        isDefaultEnvironment:
          type: boolean
          description: Whether this is the default environment
        isDeferralEnabled:
          type: boolean
          description: 'Whether deferral is enabled for this environment. Ignored (forced to `false`) for the default (production) environment.

            '
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: The user ID of the owner of the dbt environment, or null
        targetDatabase:
          type: string
          nullable: true
          description: Target database override
        targetName:
          type: string
          nullable: true
          description: Target name override
        targetRole:
          type: string
          nullable: true
          description: Target role override
        targetSchema:
          type: string
          description: Target schema for the environment
        variables:
          type: array
          description: Environment variables
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Variable identifier
              name:
                type: string
                description: Variable name
              value:
                type: string
                nullable: true
                description: 'Variable value. If `isSecret: true`, this value will be `null` in responses to protect sensitive information.

                  '
              isSecret:
                type: boolean
                description: 'Whether the variable value is secret.

                  '
    PageInfo:
      type: object
      description: Pagination information for paginated responses.
      properties:
        hasNextPage:
          type: boolean
          description: Indicates if there are more records available.
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page of results. `null` if no more results.
        pageSize:
          type: integer
          description: Number of records per page.
        totalRecords:
          type: integer
          description: Total number of records matching the query.
    Error:
      type: object
      properties:
        error:
          type: string
          description: HTTP response code for the error
          example: <response_code>
        message:
          type: string
          description: Detailed error description
          example: <error_reason>
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
  responses:
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Method Not Allowed - Invalid HTTP method for this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too Many Requests - Rate limit exceeded (60 requests/minute)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Can be either an [Organization API Key](/api/authentication#organization-api-keys) or [Personal Access Token (PAT)](/api/authentication#token-types).


        Include in the `Authorization` header as: `Bearer YOUR_TOKEN`

        '
    orgApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Requires an [Organization API Key](/api/authentication#organization-api-keys). Personal Access Tokens (PATs) are not supported for this endpoint.


        Include in the `Authorization` header as: `Bearer ORGANIZATION_API_KEY`

        '
