openapi: 3.1.0
info:
  title: Omni AI Models API
  description: "The Omni REST API provides programmatic access to your Omni instance for managing users, documents, queries, schedules, and more.  \n"
  version: 1.0.0
  contact:
    name: Omni Support
    url: https://docs.omni.co
servers:
- url: https://{instance}.omniapp.co/api
  description: Production
  variables:
    instance:
      default: blobsrus
      description: Your production Omni instance subdomain
- url: https://{instance}.playground.exploreomni.dev/api
  description: Playground
  variables:
    instance:
      default: blobsrus
      description: Your playground Omni instance subdomain
security:
- bearerAuth: []
- orgApiKey: []
tags:
- name: Models
  description: Create and manage data models
paths:
  /v1/models:
    post:
      tags:
      - Models
      summary: Create model
      description: 'Create a new model. The typical workflow for using this endpoint is:


        1. Create a schema model using this endpoint

        2. Use the [Refresh schema](/api/models/refresh-schema) endpoint to load the schema for the created model

        3. Create shared models based on the schema model

        '
      security:
      - bearerAuth: []
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - connectionId
              properties:
                connectionId:
                  type: string
                  format: uuid
                  description: ID of the connection the model is based on.
                modelKind:
                  type: string
                  enum:
                  - SCHEMA
                  - SHARED
                  - SHARED_EXTENSION
                  - BRANCH
                  default: SCHEMA
                  description: 'Type of model.


                    - `SCHEMA` - Mirrors the database structure

                    - `SHARED` - Represents the universal, governed data model that workbooks are based on

                    - `SHARED_EXTENSION` - Represents an extension to the `SHARED` model. Can be used to dynamically extend the `SHARED` model based on user attributes, or as a model that workbooks are based on in a departmental use case.

                    - `BRANCH` - A model layer that is used to develop modifications to the production shared model


                    For more information, see the [Modeling documentation](/modeling).

                    '
                modelName:
                  type: string
                  description: Name of the model.
                baseModelId:
                  type: string
                  description: '**Applicable to branch and extension models.** ID of the base model.

                    '
                accessGrants:
                  type: array
                  default: []
                  description: List of [access grants](/modeling/develop/data-access-control) for the model.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name of the access grant.
                      accessBoostable:
                        type: boolean
                        description: If `true`, the access grant can be boosted.
                allowAsWorkbookBase:
                  type: boolean
                  default: false
                  description: '**Only applicable to `SHARED_EXTENSION` models**. If `true`, allows the model to be selected as a base model when creating workbooks.

                    '
                useIsolatedBranches:
                  type: boolean
                  default: false
                  description: '**Only applicable to `SHARED_EXTENSION` models**. If `true`, branches are shown on the extension model page instead of parent shared model.

                    '
      responses:
        '200':
          description: Model created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message if creation failed
                  message:
                    type: string
                    description: Additional message
                  model:
                    type: object
                    description: Details about the model
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: ID of the created model.
                      modelKind:
                        type: string
                        description: The type of model.
                      name:
                        type: string
                        description: The name of the model.
                  success:
                    type: boolean
                    description: Indicates if the operation succeeded
        '400':
          description: 'Bad Request


            Possible error messages:


            - `Bad Request: Invalid parameter value`

            - `Bad Request: Schema model already exists for the connection`

            - `Bad Request: Schema model does not exist when creating a non-schema model`

            - `Bad Request: Shared model cannot be created when branch schema refresh is enabled`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden


            Possible error messages:


            - `Forbidden`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
      - Models
      summary: List models
      description: Retrieves a paginated list of models with their metadata.
      security:
      - bearerAuth: []
      operationId: listModels
      parameters:
      - name: baseModelId
        in: query
        required: false
        schema:
          type: string
        description: 'Filter models by base model ID.

          '
      - name: connectionId
        in: query
        required: false
        schema:
          type: string
        description: 'Filter models by connection ID.

          '
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
        description: 'If `true`, include deleted models.

          '
      - name: modelId
        in: query
        required: false
        schema:
          type: string
        description: 'Filter models by a specific model ID.

          '
      - name: modelKind
        in: query
        required: false
        schema:
          type: string
          enum:
          - SCHEMA
          - SHARED
          - SHARED_EXTENSION
          - WORKBOOK
          - BRANCH
          - QUERY
          - TOPIC
          - FIELD_PICKER_TOPIC
        description: 'Filter by model kind.

          '
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'Filter models by name.

          '
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
        description: Specifies the number of records per page.
      - name: cursor
        in: query
        schema:
          type: string
        description: Pagination cursor
      - name: sortDirection
        in: query
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
        description: 'Sort direction.

          '
      - name: sortField
        in: query
        required: false
        schema:
          type: string
          default: updatedAt
          enum:
          - name
          - modelKind
          - connectionId
          - baseModelId
          - createdAt
          - updatedAt
        description: "Field to sort by. \n"
      - name: include
        in: query
        schema:
          type: string
          enum:
          - activeBranches
        description: 'Comma-separated list of additional fields to include in the response.


          - `activeBranches` - Include active branches for each model

          '
      responses:
        '200':
          description: Paginated model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  records:
                    type: array
                    description: List of model records.
                    items:
                      allOf:
                      - $ref: '#/components/schemas/Model'
                      - type: object
                        properties:
                          branches:
                            type: array
                            description: List of branch models. Only included when `include=activeBranches`.
                            items:
                              $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}:
    patch:
      tags:
      - Models
      summary: Rename model
      description: "<Warning>\n  Workbook models and query models cannot be renamed via this endpoint.\n</Warning>\n\nRenames a model by updating its name. This endpoint allows you to programmatically rename models without using the UI, which is particularly useful for bulk operations on shared extension models created via `POST /api/v1/models`.\n\nThe new name must be unique among active models with the same `modelKind` and `baseModelId`.\n\n**Branch-specific constraints:**\n\n- Name must match git-compatible regex: `[\\w\\-/]+`\n- No git ref path conflicts (e.g., cannot rename to `team` if `team/project` exists)\n- Cannot rename branches with an open pull request (when `pullRequestUrl` is set) — renaming would desync Omni from the git remote\n"
      security:
      - bearerAuth: []
      operationId: renameModel
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the model to rename.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: The new name for the model.
                  example: customer_metrics_v2
      responses:
        '200':
          description: Model renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          description: 'Bad Request


            Possible error messages:


            - `Bad Request: Cannot rename models of kind WORKBOOK`

            - `Bad Request: Cannot rename models of kind QUERY`

            - `Bad Request: Model name must be unique`

            - `Bad Request: Branch name must match git-compatible regex [\w\-/]+`

            - `Bad Request: Branch name would create git ref path conflict`

            - `Bad Request: Cannot rename branch with open pull request`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Model not found`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/ai-agent-actions:
    get:
      tags:
      - Models
      summary: Get model AI agent actions
      description: 'Return AI agent actions configured for a model — a unified list of sample queries and skills suitable for surfacing as suggested prompts in AI interfaces.


        Sample queries come from both `model.sample_queries` and each topic''s `sample_queries`. Skills come from `model.skills` and each topic''s `skills`, deduped by ID with topic skills overriding model skills.


        When no actions are configured at the model or topic level, `records` returns an empty array.

        '
      security:
      - bearerAuth: []
      operationId: getModelAiAgentActions
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the model.
      responses:
        '200':
          description: AI agent actions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates the request was successful
                  records:
                    type: array
                    description: List of AI agent actions (sample queries and skills) configured for the model.
                    items:
                      type: object
                      required:
                      - type
                      - id
                      - label
                      - description
                      - prompt
                      properties:
                        type:
                          type: string
                          enum:
                          - sample_query
                          - skill
                          description: The type of action.
                        id:
                          type: string
                          description: Unique identifier for the action.
                        label:
                          type: string
                          description: Display label for the action.
                        description:
                          type: string
                          description: Description of what the action does.
                        prompt:
                          type: string
                          description: The prompt text to submit to the [Create AI job endpoint](/api/ai/create-ai-job). For skills, this is pre-formatted with the skill envelope.
              example:
                success: true
                records:
                - type: sample_query
                  id: revenue_by_region
                  label: Revenue by region
                  description: Show total revenue grouped by region
                  prompt: Show me revenue by region
                - type: skill
                  id: analyze_trends
                  label: Analyze trends
                  description: Analyze trends in the data
                  prompt: 'Skill: analyze_trends

                    Analyze trends in revenue over time'
        '400':
          description: 'Bad Request


            Possible error messages:


            - `modelId: Invalid UUID`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden


            Possible error messages:


            - `Permission denied`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Model with id <modelId> does not exist`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/branch/{branchName}:
    delete:
      tags:
      - Models
      summary: Delete branch
      description: Deletes a branch associated with the specified shared model.
      security:
      - bearerAuth: []
      operationId: deleteModelBranch
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the shared model.
      - name: branchName
        in: path
        required: true
        schema:
          type: string
        description: Name of the branch to delete.
      responses:
        '200':
          description: Branch deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 'Bad Request


            Possible error messages:


            - `Bad Request: Invalid modelId format`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Shared model or branch model does not exist`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/refresh:
    post:
      tags:
      - Models
      summary: Refresh schema
      description: "<Note>\n  This endpoint requires either **Connection Admin** or **Modeler** permissions:\n\n  - **Modelers** can use this endpoint on connections that have exactly **one** shared model\n  - **Connection Admins** can use this endpoint on any connection they are an admin of, whether the connection has one or multiple models\n</Note>\n\nRefreshes the schema of the specified model. This will cause the model to reflect the latest changes to schemas, views, and fields from the data source. Schema refreshes will remove structures that are no longer present in the source, but not anything created by users.\n\nDepending on whether the **Branch-based schema refresh** setting is configured:\n\n- If **Branch-based schema refresh** is enabled, the `branch_id` query parameter is required. The `branch_id` is validated against the shared model.\n- If **Branch-based schema refresh** isn't enabled, do not provide the `branch_id` parameter. The API will return a `400` error in this case.\n"
      security:
      - bearerAuth: []
      operationId: refreshSchema
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the model to be refreshed.
      - name: branch_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: '**Required if Branch-based schema refresh is enabled**. The ID of the branch for models with this setting enabled.


          Do not provide this parameter when the setting is not enabled.

          '
      - name: hard_refresh
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: 'Whether to perform a hard refresh (removes dropped objects) or soft refresh (additive only). Defaults to true (hard refresh).

          '
      - name: schemas
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated list of schemas to selectively refresh. Can only be used when `hard_refresh=false`.

          '
      - name: tables
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated list of tables to selectively refresh. Can only be used when `hard_refresh=false`.

          '
      responses:
        '200':
          description: Model refresh started
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                    description: ID of the job.
                  modelId:
                    type: string
                    format: uuid
                    description: ID of the model.
                  status:
                    type: string
                    example: running
                    description: Status of the schema refresh. This value will be `running` to indicate that the refresh has started.
        '400':
          description: 'Bad Request


            Possible error messages:


            - `Bad Request: modelId: Invalid uuid`

            - `Bad Request: branch_id: Invalid uuid`

            - `Bad Request: branch_id is required when branch schema refresh is enabled`

            - `Bad Request: branch_id must not be provided when branch schema refresh is not enabled`

            - `Bad Request: selective schemas/tables filters require hard_refresh=false`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found


            Possible causes:


            - Model not found

            - Branch not found or does not belong to the model''s shared model

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/cache_reset/{cachePolicyName}:
    post:
      tags:
      - Models
      summary: Reset cache
      description: "Resets the cache for the specified cache policy.\n\n<Note>\n  `cachePolicyName` values are not validated against existing policies. Verify that the values you provide are exact matches to policies in the model.\n</Note>\n"
      security:
      - bearerAuth: []
      operationId: resetModelCache
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the model associated with the cache policy.
      - name: cachePolicyName
        in: path
        required: true
        schema:
          type: string
        description: The name of the cache policy to reset.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resetAt:
                  type: string
                  format: date-time
                  description: 'An ISO-8601 date string that sets the time the cache should be reset (invalidated). When set, cache entries created between this value and the current time will still be considered valid. Cannot be a future date. Defaults to now.

                    '
      responses:
        '200':
          description: Cache reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  cache_reset:
                    type: object
                    description: The cache reset details.
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: ID of the cache reset record.
                      model_id:
                        type: string
                        format: uuid
                        description: ID of the model.
                      policy_name:
                        type: string
                        description: Name of the cache policy.
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp when the cache reset record was created.
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp when the cache reset record was last updated.
                      reset_at:
                        type: string
                        format: date-time
                        description: Timestamp when the cache was reset.
                  success:
                    type: boolean
                    description: Indicates the request was successful.
        '400':
          description: 'Bad Request


            Possible error messages:


            - `Model with id <modelId> does not exist`

            - `resetAt cannot be future dated`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Model with id <modelId> does not exist`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/yaml:
    post:
      tags:
      - Models
      summary: Create or update YAML files
      description: 'Creates or overwrites a YAML file for a model. The file can be a special file (`model` or `relationships`) or a YAML file ending in `.topic` or `.view`.


        The following models cannot be edited using this endpoint:


        - Schema models

        - Models using git follower mode

        '
      security:
      - bearerAuth: []
      operationId: updateModelYaml
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fileName
              - yaml
              - mode
              properties:
                branchId:
                  type: string
                  format: uuid
                  description: '**Required if git pull requests are required for the model.** The ID of the branch to create or update. To retrieve branch IDs, use the [List models](/api/models/list-models) endpoint with `modelKind=BRANCH`.

                    '
                fileName:
                  type: string
                  description: 'The name of the YAML file. Valid values are:


                    - `model` - [Model file](/modeling/models)

                    - `relationships` - [Relationships file](/modeling/relationships)

                    - `<topic_name>.topic` - [Topic file](/modeling/topics/parameters)

                    - `<view_name>.view` - [View file](/modeling/views)

                    '
                yaml:
                  type: string
                  description: 'The YAML contents of the file. This can be empty, in which case:


                    - If empty and used with `mode: extension` the file will be removed from the model

                    - If empty and used with `mode: combined`, the file will be ignored in the model

                    '
                mode:
                  type: string
                  default: combined
                  enum:
                  - combined
                  - extension
                  - staged
                  - merged
                  - history
                  description: 'The mode to use when creating or overwriting the YAML file.


                    **Note**: Workbook models must use `combined` mode if there is a `branchId`.

                    '
                commitMessage:
                  type: string
                  description: '**Required for [git-enabled models](/integrations/git).** Commit message describing the change.

                    '
                previousChecksum:
                  type: string
                  description: 'Checksum of the file when fetched, for conflict detection. Obtain this value from the [Get model YAML endpoint](/api/models/get-model-yaml) by including the `includeChecksums` parameter.


                    If the file has been modified since you fetched it, the request will fail with a `File has been modified since it was fetched` error.

                    '
                fullyResolved:
                  type: boolean
                  default: false
                  description: 'If `true`, accepts fully-resolved YAML. This means that Omni will resolve any extension (`extends`) usage and place the changes into the appropriate model files.


                    When `false` (default), the YAML is saved as-is to the specified file. This means that even if extensions are used, they will not be included in the changes.

                    '
      responses:
        '200':
          description: YAML file updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileName:
                    type: string
                    description: The name of the file that was created or updated.
                  success:
                    type: boolean
                    description: Indicates the request was successful.
        '400':
          description: 'Bad Request


            Possible error messages:


            - `<parameter>: <parameter> is required`

            - `modelId: Invalid uuid`

            - `branchId: Invalid uuid`

            - `<parameter>: Invalid value <description>`

            - `File has been modified since it was fetched`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden


            Possible error messages:


            - `Permission denied`

            - `Feature not enabled`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Model with id <modelId> does not exist`

            - `Branch does not exist`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
      - Models
      summary: Get model YAML
      description: Retrieves the YAML representation of a model with optional filtering and mode selection.
      security:
      - bearerAuth: []
      operationId: getModelYaml
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the model.
      - name: branchId
        in: query
        schema:
          type: string
          format: uuid
        description: The ID of the branch to retrieve YAML from. Only valid for shared models in `combined` mode. To retrieve branch IDs, use the [List models](/api/models/list-models) endpoint with `modelKind=BRANCH`.
      - name: fileName
        in: query
        schema:
          type: string
        description: Filter YAML files by name. Can be a string or a regex pattern.
      - name: mode
        in: query
        schema:
          type: string
          default: combined
          enum:
          - extension
          - staged
          - combined
        description: 'The mode to use when retrieving YAML.


          - `extension` - Returns extension-only format

          - `staged` - Returns staged changes

          - `combined` - Returns combined YAML

          '
      - name: includeChecksums
        in: query
        schema:
          type: boolean
          default: false
        description: 'If `true`, the response will include file checksums for concurrency control.


          A file''s checksum can be passed as a query parameter in the [Create or update YAML endpoint](/api/models/create-or-update-yaml-files) to ensure changes made by another user aren''t overwritten.

          '
      - name: includeSchemas
        in: query
        schema:
          type: string
        description: 'Filters the returned YAML to only include views from the specified schema. Relationships are preserved even if they reference views outside the specified schema.


          This parameter accepts a single schema name only. Use the [List model schemas endpoint](/api/models/list-model-schemas) to discover available schema names.

          '
      - name: fullyResolved
        in: query
        schema:
          type: boolean
          default: false
        description: 'If `true`, returns YAML with any extensions (`extends`) resolved. This will match what runs at query time.


          When `false` (default), returns the YAML as authored in the model files. This means even if extensions are used, they will not be included in the returned YAML.

          '
      responses:
        '200':
          description: Model YAML specification
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: object
                    additionalProperties:
                      type: string
                    description: Map of file paths to YAML content.
                  version:
                    type: integer
                    description: Version of the YAML.
                  viewNames:
                    type: object
                    description: Map of view names to their definitions.
                  checksums:
                    type: object
                    description: Map of file paths to their checksums.
              example:
                files:
                  model.yaml: 'name: Test Model

                    type: model'
                  views/customers.yaml: 'name: Customers

                    fields: []'
                  views/orders.yaml: 'name: Orders

                    fields: []'
                version: 1
                viewNames: {}
        '400':
          description: 'Bad Request


            Possible error messages:


            - `Schema models do not have branches`

            - `Branches are not valid for workbook models with mode=extension, staged`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden


            Possible error messages:


            - `Permission denied`

            - `Feature not enabled`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Model with id <modelId> does not exist`

            - `Branch does not exist`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 'Internal Server Error


            Possible error messages:


            - `Failed to get model YAML`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Models
      summary: Delete a YAML file
      description: 'Deletes a topic or view YAML file from a model. The file must be a YAML file ending in `.topic` or `.view`.


        The following models cannot be edited using this endpoint:


        - Schema models

        - Models using git follower mode

        '
      security:
      - bearerAuth: []
      operationId: deleteModelYaml
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the model.
      - name: fileName
        in: query
        required: true
        schema:
          type: string
        description: 'The name of the YAML file to delete. Valid values are:


          - `<topic_name>.topic` - [Topic file](/modeling/topics/parameters)

          - `<view_name>.view` - [View file](/modeling/views)

          '
      - name: branchId
        in: query
        schema:
          type: string
          format: uuid
        description: '**Required if git pull requests are required for the model.** The ID of the branch to delete from. To retrieve branch IDs, use the [List models](/api/models/list-models) endpoint with `modelKind=BRANCH`.

          '
      - name: mode
        in: query
        schema:
          type: string
          default: combined
          enum:
          - combined
          - extension
          - staged
          - merged
          - history
        description: 'The mode to use when deleting the YAML file.


          **Note**: Workbook models must use `combined` mode if there is a `branchId`.

          '
      - name: commitMessage
        in: query
        schema:
          type: string
        description: '**Required for [git-enabled models](/integrations/git).** Commit message describing the change.

          '
      responses:
        '200':
          description: YAML file deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileName:
                    type: string
                    description: The name of the file that was deleted.
                  success:
                    type: boolean
                    description: Indicates the request was successful.
        '400':
          description: 'Bad Request


            Possible error messages:


            - `<parameter>: <parameter> is required`

            - `modelId: Invalid uuid`

            - `branchId: Invalid uuid`

            - `<parameter>: Invalid value <description>`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden


            Possible error messages:


            - `Permission denied`

            - `Feature not enabled`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Model with id <modelId> does not exist`

            - `Branch does not exist`

            - `File does not exist`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/schemas:
    get:
      tags:
      - Models
      summary: List model schemas
      description: Retrieves a sorted list of all available schema names for the specified model, including physical, virtual, and dynamic schemas.
      security:
      - bearerAuth: []
      operationId: getModelSchemas
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the model.
      - name: branchId
        in: query
        schema:
          type: string
          format: uuid
        description: 'The ID of the branch to retrieve schemas from.

          '
      responses:
        '200':
          description: List of schema names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                description: Sorted array of schema names available in the model.
              example:
              - ANALYTICS
              - PUBLIC
              - STAGING
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden


            Possible error messages:


            - `Permission denied`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Model with id <modelId> does not exist`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/validate:
    get:
      tags:
      - Models
      summary: Validate model
      description: Retrieves validation issues for a model and its branches.
      security:
      - bearerAuth: []
      operationId: validateModel
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the model.
      - name: branchId
        in: query
        schema:
          type: string
          format: uuid
        description: 'The ID of the branch to validate. The branch must exist for the model. If not provided, the model is validated directly. To retrieve branch IDs, use the [List models](/api/models/list-models) endpoint with `modelKind=BRANCH`.


          **Note**: Schema models do not support branches.

          '
      responses:
        '200':
          description: A list of validation issues.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    message:
                      type: string
                      description: The validation issue message.
                    is_warning:
                      type: boolean
                      description: If `true`, the issue is a warning. If `false`, the issue is an error.
                    yaml_path:
                      type: string
                      description: The path to the YAML file containing the issue.
                    auto_fix:
                      type: object
                      description: Information about automatic fixes available for the issue.
                      properties:
                        description_short:
                          type: string
                          description: A short description of the auto-fix.
                        description_unique:
                          type: string
                          description: A unique description of the auto-fix.
              example:
              - message: No view "blob_sales". Set base_view to a valid, existing view.
                is_warning: false
                yaml_path: blob_sales.topic
                auto_fix:
                  description_short: Delete topic "blob_sales"
                  description_unique: Delete topic "blob_sales"
        '400':
          description: 'Bad Request


            Possible error messages:


            - `modelId: Invalid uuid`

            - `Schema models do not have branches`

            - `Unrecognized key(s) in object: ''<invalidParameter>''`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Model with id <modelId> does not exist`

            - `Branch model with id <branchId> does not exist`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 'Internal Server Error


            Possible error messages:


            - `Model service error`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/models/{modelId}/migrate:
    post:
      tags:
      - Models
      summary: Migrate a model
      description: "Copies a model from one Omni connection to another by reading the source model's YAML at a specific git ref and writing it to the target model. Supports same-organization and cross-organization migrations.\n\nThis API:\n\n1. Reads the full model YAML from the source model's git repository at the specified `gitRef` (merged with the default branch).\n2. If `branchName` is provided and the branch already exists on the target model, the API writes to that branch. If the branch doesn't exist, one is created.\n3. Writes the YAML to the target model or branch, replacing its model definition.\n\n### Requirements\n\nTo successfully migrate a model:\n\n- The user performing the migration must have:\n   - **For the source model** - **Querier**, **Modeler**, or **Connection Admin** permissions \n   - **For the target model** - **Modeler** or **Connection Admin** permissions\n   - **For cross-organization migrations** - The user must be a member of both organizations\n- The source model must have [git configured](/integrations/git). This is required so the API can read the model YAML from the repository.\n- The target model should have an identical schema model to the source model at the instant the git ref was committed.\n"
      security:
      - orgApiKey: []
      operationId: migrateModel
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The shared model ID to read YAML from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - gitRef
              - targetModelId
              properties:
                gitRef:
                  type: string
                  description: Git reference (branch name, tag, or commit SHA) to read the source model YAML from.
                  example: main
                targetModelId:
                  type: string
                  format: uuid
                  description: The shared model ID to write the YAML to.
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                branchName:
                  type: string
                  description: '**Required if the target model has git enabled.**. Branch name on the target model. If the branch doesn''t exist, it will be created.

                    '
                  example: migrate-from-prod
                commitMessage:
                  type: string
                  description: Git commit message.
                  example: Migrate model from production
                deleteViewsAndTopicsMissingFromSource:
                  type: boolean
                  description: 'Controls how views and topics present in the target model but missing from the source model are handled. When `true` (default), these views and topics are marked as `ignored: true`. When `false`, they are inherited from the parent model instead.

                    '
                  default: true
                  example: true
            example:
              gitRef: main
              targetModelId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              branchName: migrate-from-prod
              commitMessage: Migrate model from production
              deleteViewsAndTopicsMissingFromSource: true
      responses:
        '200':
          description: Model migrated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the migration completed successfully.
                    example: true
              example:
                success: true
        '400':
          description: 'Bad Request


            Possible error messages:


            - `Bad Request: Invalid JSON body`

            - `Bad Request: gitRef is empty`

            - `Bad Request: targetModelId is not a valid UUID`

            - `Bad Request: Target model has git enabled but branchName was not provided`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden


            Possible error messages:


            - `Forbidden: User does not have access to the source or target model`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Not Found: Source model not found`

            - `Not Found: Target model not found`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/models/{modelId}/view/{viewName}:
    delete:
      tags:
      - Models
      summary: Delete view
      description: 'Deletes or ignores a view from a model extension layer. Use the `mode` parameter to specify the behavior of this endpoint.

        '
      security:
      - bearerAuth: []
      operationId: deleteView
      parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the model.
      - name: viewName
        in: path
        required: true
        schema:
          type: string
        description: The name of the view to delete or ignore.
      - name: branchId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional branch ID
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - COMBINED
          - MERGED
          - EXTENSION
          default: EXTENSION
        description: 'Controls how the view is deleted or hidden:


          - `COMBINED` — **Default**. Marks the view as ignored (`ignored: true`) if it exists in the parent model, otherwise hard-deletes

          - `EXTENSION` — Hard-deletes the view from the extension layer

          - `MERGED` — Marks the view as `shallowIgnored: true`, hiding it only from the immediate parent layer

          '
      responses:
        '200':
          description: View deleted or ignored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 'Bad Request


            Possible error messages:


            - `Bad Request: Invalid modelId format`

            - `Bad Request: Invalid mode parameter`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found


            Possible error messages:


            - `Model not found`

            - `View not found`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  responses:
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad Request - Invalid parameters or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Method Not Allowed - Invalid HTTP method for this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too Many Requests - Rate limit exceeded (60 requests/minute)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PageInfo:
      type: object
      description: Pagination information for paginated responses.
      properties:
        hasNextPage:
          type: boolean
          description: Indicates if there are more records available.
        nextCursor:
          type: string
          nullable: true
          description: Cursor for the next page of results. `null` if no more results.
        pageSize:
          type: integer
          description: Number of records per page.
        totalRecords:
          type: integer
          description: Total number of records matching the query.
    Error:
      type: object
      properties:
        error:
          type: string
          description: HTTP response code for the error
          example: <response_code>
        message:
          type: string
          description: Detailed error description
          example: <error_reason>
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    Model:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID of the model.
        baseModelId:
          type: string
          format: uuid
          nullable: true
          description: ID of the base model, if applicable.
        connectionId:
          type: string
          format: uuid
          nullable: true
          description: ID of the connection the model is based on.
        modelKind:
          type: string
          nullable: true
          description: The type of model.
        name:
          type: string
          nullable: true
          description: The name of the model.
        createdAt:
          type: string
          format: date-time
          description: The time the model was created.
        updatedAt:
          type: string
          format: date-time
          description: The time the model was last updated.
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: The time the model was deleted, if applicable.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Can be either an [Organization API Key](/api/authentication#organization-api-keys) or [Personal Access Token (PAT)](/api/authentication#token-types).


        Include in the `Authorization` header as: `Bearer YOUR_TOKEN`

        '
    orgApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Requires an [Organization API Key](/api/authentication#organization-api-keys). Personal Access Tokens (PATs) are not supported for this endpoint.


        Include in the `Authorization` header as: `Bearer ORGANIZATION_API_KEY`

        '
